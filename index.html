:root{
  color-scheme:dark;
  --bg:#0e2820; --plate:#132e24;
  --text:#f4f7f9; --text-2:rgba(255,255,255,.82); --text-dim:rgba(255,255,255,.62);
  --text-faint:rgba(255,255,255,.51); --text-ghost:rgba(255,255,255,.34);
  --accent:#e3c886; --accent-2:#e3c886; --accent-3:#e3c886; --on-accent:#122417;
  --accent-glow:rgba(227,200,134,.30);
  --grad:linear-gradient(180deg,#eed9a4,#d8b878); --gradient:linear-gradient(180deg,#eed9a4,#d8b878);
  --success:#5fdc97; --green:#5fdc97; --success-light:rgba(95,220,151,.08);
  --warning:#f78c3a; --warn:#f78c3a; --amber:#f78c3a; --warning-light:rgba(247,140,58,.07);
  --danger:#ff6b6b; --red:#ff6b6b; --danger-light:rgba(255,107,107,.09);
  --rt-inj:#e3c886; --rt-oral:#f78c3a; --rt-nasal:#c78bf0;
  --border:rgba(255,255,255,.10); --border-light:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14); --hair:rgba(255,255,255,.10);
  --film:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035) 42%,rgba(255,255,255,.02));
  --sheen:linear-gradient(165deg,rgba(227,200,134,.05),rgba(53,179,160,.02) 40%,rgba(0,0,0,0) 70%);
  --glass:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035) 42%,rgba(255,255,255,.02)),linear-gradient(165deg,rgba(227,200,134,.05),rgba(53,179,160,.02) 40%,rgba(0,0,0,0) 70%),#132e24;
  --glass-hover:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05) 42%,rgba(255,255,255,.03)),linear-gradient(165deg,rgba(227,200,134,.06),rgba(53,179,160,.03) 40%,rgba(0,0,0,0) 70%),#17372c;
  --glass-strong:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 50%,rgba(255,255,255,.015)),rgba(10,26,20,.90);
  --bg-card:#132e24; --bg-card-2:rgba(255,255,255,.05); --bg-input:rgba(0,0,0,.32);
  --edge1:inset 0 1px 0 rgba(255,255,255,.20); --edge2:inset 0 1px 0 rgba(255,255,255,.32);
  --occl:inset 0 -1px 0 rgba(0,0,0,.40);
  --shadow1:0 1px 0 rgba(0,0,0,.45),0 10px 24px -12px rgba(0,0,0,.55);
  --on-success:#06231a; --ink-35:rgba(255,255,255,.35); --ink-45:rgba(255,255,255,.45); --ink-50:rgba(255,255,255,.5);
  --fill-1:rgba(255,255,255,.04); --fill-2:rgba(255,255,255,.055); --fill-3:rgba(255,255,255,.08); --fill-4:rgba(255,255,255,.18);
  --chrome:rgba(10,26,20,.62); --scrim:rgba(4,12,9,.62);
  --sheet-bg:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 50%,rgba(255,255,255,.015)),rgba(10,26,20,.72);
  --foot-bg:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02)),rgba(10,26,20,.96);
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r-lg:18px; --r-md:14px;
  --me-out:cubic-bezier(.16,1,.3,1); --me-sheet:cubic-bezier(.32,.72,0,1);
  --me-pop:cubic-bezier(.34,1.56,.64,1); --me-exit:cubic-bezier(.4,0,.7,1);
  --me-commit:cubic-bezier(.7,0,.84,0);
  --mt-tap:120ms; --mt-fast:200ms; --mt-move:320ms;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;overflow-x:hidden;overflow-x:clip}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,[role="button"]{touch-action:manipulation;cursor:pointer}
input,textarea,select{font-size:16px !important;-webkit-appearance:none}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.hide-scrollbar{scrollbar-width:none}
.hide-scrollbar::-webkit-scrollbar{display:none}
.mono,[data-mono]{font-family:var(--mono);letter-spacing:0;font-variant-ligatures:none}
input[type="date"],input[type="datetime-local"]{color-scheme:dark}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
details > summary{list-style:none;cursor:pointer}

/* ── Tier 0: ambient — pure gradients, zero filters, zero animation ── */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;background:
  radial-gradient(460px 380px at 50% -80px,rgba(227,200,134,.12),transparent 68%),
  radial-gradient(380px 380px at calc(100% + 60px) 380px,rgba(53,179,160,.10),transparent 68%),
  radial-gradient(360px 360px at 50% calc(100% + 120px),rgba(9,20,14,.55),transparent 68%)}
.ambient::before,.ambient::after{content:none}
.ambient .lg-blob{display:none}

/* ── Tier 1: cast glass (opaque plate + film + sheen; NO backdrop-filter) ── */
.card,.glass,.lg{position:relative;isolation:isolate;background:var(--glass);
  backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
  border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--edge1),var(--occl),var(--shadow1)}
.card{padding:10px 12px;transition:transform var(--mt-tap) var(--me-out)}
.card:active{transform:scale(.985)}
.lg::before{content:none}
.card-logged{background:linear-gradient(180deg,rgba(95,220,151,.10),rgba(95,220,151,.02) 55%),var(--sheen),var(--plate) !important;
  border-color:rgba(95,220,151,.30) !important;opacity:1 !important}
.card-skipped{background:linear-gradient(180deg,rgba(247,140,58,.08),rgba(247,140,58,.015) 55%),var(--sheen),var(--plate) !important;
  border-color:rgba(247,140,58,.26) !important;opacity:1 !important}

/* ── Tier 2: floating chrome (the ONLY real blur: sheet/popover/toast via .glass-strong, nav via .pill-nav) ── */
.glass-strong{background:var(--glass-strong);
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border:1px solid var(--border-strong);
  box-shadow:var(--edge2),inset 0 -1px 0 rgba(0,0,0,.35),0 16px 40px -12px rgba(0,0,0,.60)}

/* ── wells (inputs are carved, not raised) ── */
.input{background:var(--bg-input);border:1px solid var(--border);color:var(--text);
  padding:14px 16px;border-radius:var(--r-md);font-size:16px;outline:none;width:100%;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.05);
  transition:border-color 150ms,box-shadow 150ms}
.input:focus{border-color:rgba(227,200,134,.5);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.45),0 0 0 3px rgba(227,200,134,.18)}
.input::placeholder{color:rgba(255,255,255,.40)}

/* ── buttons ── */
.btn{padding:9px 14px;min-height:44px;border-radius:12px;font-weight:600;border:none;cursor:pointer;font-size:13px;
  text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;
  transition:transform var(--mt-tap) var(--me-out),opacity var(--mt-fast);
  backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:var(--on-accent);
  box-shadow:0 8px 22px -6px rgba(227,200,134,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-primary:disabled{background:rgba(255,255,255,.08);color:var(--text-faint);box-shadow:none;cursor:not-allowed}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn-ghost:hover{background:rgba(255,255,255,.11)}
.btn-danger{background:rgba(255,107,107,.15);color:var(--danger);border:1px solid rgba(255,107,107,.3)}
.btn-success{background:rgba(95,220,151,.15);color:var(--success);border:1px solid rgba(95,220,151,.3)}

/* ── floating nav ── */
.pill-nav-wrap{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:min(calc(100% - 40px),400px);z-index:100}
.pill-nav{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 55%),var(--chrome);
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border:1px solid var(--border-strong);border-radius:29px;padding:5px;
  display:grid;grid-template-columns:repeat(4,1fr);
  box-shadow:var(--edge2),inset 0 -1px 0 rgba(0,0,0,.35),0 12px 32px -8px rgba(0,0,0,.55)}
.pill-nav-item{padding:8px 6px;border-radius:24px;color:var(--text-dim);font-size:11px;font-weight:600;
  letter-spacing:.02em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:none;background:transparent;transition:color var(--mt-fast)}
.pill-nav-item.active{background:rgba(227,200,134,.14);
  box-shadow:inset 0 0 0 1px rgba(227,200,134,.32),inset 0 1px 0 rgba(255,255,255,.25);color:var(--accent)}

/* ── segmented / chips / sections ── */
.seg-control{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--border);
  border-radius:var(--r-md);padding:4px;gap:2px}
.seg-item{padding:8px 16px;border-radius:11px;font-size:13px;font-weight:600;color:var(--text-dim);
  cursor:pointer;border:none;background:transparent;transition:background var(--mt-fast),color var(--mt-fast)}
.seg-item.active{background:rgba(255,255,255,.14);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:100px;
  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.chip-blue{background:rgba(227,200,134,.14);color:var(--accent);border:1px solid rgba(227,200,134,.3)}
.chip-green{background:rgba(95,220,151,.15);color:var(--success);border:1px solid rgba(95,220,151,.3)}
.chip-amber{background:rgba(247,140,58,.15);color:var(--warn);border:1px solid rgba(247,140,58,.3)}
.chip-grey{background:rgba(255,255,255,.06);color:var(--text-dim);border:1px solid var(--border)}
.section-h{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;
  letter-spacing:.08em;margin:24px 4px 8px;display:flex;align-items:center;gap:8px}
.section-h::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);order:1}
.section-h .count{font-size:11px;color:var(--text-dim);font-weight:600;font-family:var(--mono);order:2}
.struck{text-decoration:line-through;color:var(--text-faint)}
.gradient-text{background:none;-webkit-text-fill-color:var(--text);color:var(--text)}
.pulse-dot{animation:none}

/* ── motion vocabulary (transform/opacity only) ── */
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.anim-slide-up{animation:slideUp .35s var(--me-out)}
.anim-fade-in{animation:fadeIn .2s var(--me-out)}
@keyframes discPop{0%{transform:scale(0)}62%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes rip{from{transform:scale(1);opacity:.85}to{transform:scale(2.6);opacity:0}}
@keyframes ckDraw{to{stroke-dashoffset:0}}
/* Lab reconstitution guide animations (instructional, bounded SVG) */
@keyframes vialRoll{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes fingerLeft{0%,100%{transform:translateX(0)}50%{transform:translateX(-3px)}}
@keyframes fingerRight{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes arrowFlow{0%{stroke-dashoffset:30;opacity:.4}50%{opacity:1}100%{stroke-dashoffset:0;opacity:.4}}
.vial-roll{animation:vialRoll 2.4s linear infinite;transform-origin:center}
.finger-l{animation:fingerLeft 1.6s ease-in-out infinite;transform-origin:center}
.finger-r{animation:fingerRight 1.6s ease-in-out infinite;transform-origin:center}
.arrow-flow{stroke-dasharray:30;animation:arrowFlow 1.6s ease-in-out infinite}
/* syringe fine-adjust slider */
input[type=range].aurora-range{-webkit-appearance:none;appearance:none;height:8px;border-radius:6px;
  background:rgba(227,200,134,.22);outline:none;cursor:pointer}
input[type=range].aurora-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;
  border-radius:50%;background:var(--grad);box-shadow:0 4px 14px rgba(227,200,134,.4),inset 0 1px 0 rgba(255,255,255,.5);cursor:pointer}
input[type=range].aurora-range::-moz-range-thumb{width:28px;height:28px;border:none;border-radius:50%;
  background:var(--accent);cursor:pointer}

/* == stage hooks: header == */
/* compact bar — the screen's ONLY header blur layer */
.hdr{position:sticky;top:0;z-index:60;margin-top:calc(-1 * env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 60%),var(--chrome);
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,0);box-shadow:var(--edge2);
  transition:border-color 240ms ease}
.hdr.scrolled{border-bottom-color:var(--border-light)}
.hdr-in{max-width:480px;margin:0 auto;height:48px;padding:0 10px;display:flex;align-items:center;gap:8px}
.hdr-btn{width:44px;height:44px;display:grid;place-items:center;color:var(--text-dim);flex-shrink:0;
  background:none;border:none;padding:0}
.hdr-center{flex:1;position:relative;height:44px;min-width:0}
.hdr-center>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7px;
  white-space:nowrap;transition:opacity var(--mt-fast) var(--me-out),transform var(--mt-fast) var(--me-out)}
.hdr-mark{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--text-dim)}
.hdr-title{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--text);opacity:0;transform:translateY(6px);pointer-events:none}
.hdr-title .mini{font-size:12px;font-weight:700;color:var(--accent)}
.hdr.scrolled .hdr-mark{opacity:0;transform:translateY(-6px)}
.hdr.scrolled .hdr-title{opacity:1;transform:none}
/* sync capsule — 26px visual, ::after expands hit to 44pt */
.sync-cap{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;
  background:rgba(255,255,255,.06);border:1px solid var(--hair);
  font-family:var(--mono);font-size:11px;color:var(--text-dim);position:relative;flex-shrink:0;white-space:nowrap}
.sync-cap::after{content:'';position:absolute;inset:-9px}
.sync-cap.setup{color:var(--accent);border-color:rgba(227,200,134,.3)}
.sync-cap.error{color:var(--danger);border-color:rgba(255,107,107,.3)}
.sync-cap.queued{color:var(--warn);border-color:rgba(247,140,58,.3)}
/* avatar profile button */
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(227,200,134,.18);border:none;padding:0;
  box-shadow:inset 0 0 0 1px rgba(227,200,134,.4);display:grid;place-items:center;
  font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;position:relative}
.avatar::after{content:'';position:absolute;inset:-6px}
.avatar.sm{width:28px;height:28px;font-size:12px}
.avatar.sm::after{content:none}
.menu-row{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 10px;border-radius:10px;
  background:transparent;border:none;color:var(--text);font-size:15px;text-align:left}
.menu-row:active{background:rgba(255,255,255,.07)}
.menu-hair{height:1px;background:var(--border-light);margin:6px 4px}
/* large header — normal flow, scrolls under the bar */
.hdr-large{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:10px 18px 0}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-dim);margin:2px 0}
.title-row{display:flex;align-items:center;gap:12px}
.large-title{margin:0;font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.02em;flex:1;color:var(--text)}
.ring-wrap{width:44px;height:44px;position:relative;display:grid;place-items:center;flex-shrink:0}
.ring-wrap svg{position:absolute;inset:2px}
.ring-track{stroke:var(--hair)}
.ring-arc{stroke:var(--accent)}
.ring-arc.done{stroke:var(--success)}
.ring-num{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-2);position:relative}
.ring-num.done{color:var(--success)}
/* week strip — 7 fluid columns, 44pt+ cells */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:10px 0 2px}
.day{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  position:relative;background:none;border:none;padding:0}
.day .dnum{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text-2);
  width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.day .dw{font-size:11px;font-weight:500;text-transform:uppercase;color:var(--text-ghost)}
.day.sel .dnum{background:var(--accent);color:var(--on-accent);font-weight:700}
.day.today .dnum{color:var(--accent)}
.day .dot{width:3px;height:3px;border-radius:50%;background:var(--text-ghost)}
.day .dot.done{background:var(--success);width:5px;height:5px;border-radius:3px}
.day .dot.none{background:transparent}
/* == stage hooks: cards == */
/* D4 dose-card state system — state enters ONLY as wash+border+chip;
   speculars/occlusion/shadows/numerals never tint. Glow is static, never pulsing. */
.card-due-glow{background:linear-gradient(180deg,rgba(227,200,134,.08),rgba(227,200,134,.015) 55%),var(--sheen),var(--plate) !important;
  border-color:rgba(227,200,134,.30) !important;
  box-shadow:var(--edge1),var(--occl),var(--shadow1),0 0 0 1px rgba(227,200,134,.18),0 10px 28px -10px rgba(227,200,134,.28) !important}
.card-expired .rt-tile{filter:grayscale(1);opacity:.6}
.card-future{background:var(--fill-1),var(--plate) !important;
  border-color:rgba(255,255,255,.07) !important}
/* C2 expired-cycle banner (amber wash card above route filters) */
.banner-expired{background:linear-gradient(180deg,rgba(247,140,58,.08),rgba(247,140,58,.015) 55%),var(--sheen),var(--plate);
  border-color:rgba(247,140,58,.30)}
/* == stage hooks: sheet == */
/* D5 sheet physics — wrapper is transparent; scrim (NO blur) fades alone; sheet slides.
   Blur is deferred: .settled (added on transitionend) is the sheet's ONLY backdrop-filter. */
.sheet-wrap{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;justify-content:center}
.sheet-scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 240ms linear}
.sheet-scrim.open{opacity:1}
.sheet{position:relative;width:100%;max-width:480px;max-height:88vh;max-height:88svh;
  display:flex;flex-direction:column;border-radius:28px 28px 0 0;
  background:var(--glass-strong);
  border:1px solid var(--border-strong);border-bottom:none;
  box-shadow:var(--edge2),0 -24px 60px -20px rgba(0,0,0,.7);
  transform:translateY(103%);transition:transform 420ms var(--me-sheet);will-change:transform}
.sheet.open{transform:translateY(0)}
.sheet.closing{transition:transform 280ms var(--me-exit)}
.sheet.settled{-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  background:var(--sheet-bg);
  will-change:auto}
.sheet-grab{width:100%;min-height:32px;flex-shrink:0;display:grid;place-items:center;
  background:none;border:none;padding:8px 0 4px;cursor:pointer}
.sheet-grab i{width:36px;height:5px;border-radius:3px;background:var(--fill-4);display:block}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
/* confirm bar — a flex sibling BELOW .sheet-body (the sheet portals it into .sheet-foot-slot), so the scrolling
   content always ends above it. Sticky-inside-the-scroller was offset by the scroller's padding on iOS and
   covered the last rows (the Plan disclosure) at the end of the scroll. */
.sheet-foot-slot{flex-shrink:0}
.sheet-foot-slot:empty{display:none}
.sheet:has(.sheet-foot) .sheet-body{padding-bottom:16px}
.sheet-foot{display:flex;gap:10px;align-items:stretch;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.08);
  background:var(--foot-bg)}
/* D5 'The Draw' instrument panel (rides .card cast-glass; later rules win, no blur) */
.draw{padding:14px 14px 12px;border-radius:16px;margin-bottom:14px}
.draw:active{transform:none}
.draw .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.readout{display:flex;align-items:baseline;gap:6px}
.readout .rv{font-family:var(--mono) !important;font-size:40px !important;line-height:1;font-weight:700;
  color:var(--accent);font-variant-numeric:tabular-nums;background:transparent;border:none;outline:none;
  padding:0;width:4.6ch;min-width:0;transition:color 150ms}
.readout .ru{font-size:16px;color:var(--text-dim)}
.readout .conv{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--text-2);text-align:right}
.readout.warned .rv{color:var(--warn)}
.readout.blocked .rv{color:var(--danger)}
.barrel-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.step{width:44px;height:44px;padding:0;border-radius:14px;display:grid;place-items:center;
  font-size:22px;color:var(--text-2);flex-shrink:0;cursor:pointer}
.step:active{transform:scale(.94)}
.barrel-svg{flex:1;min-width:0;touch-action:none;display:block;overflow:visible;cursor:grab}
.draw .cap{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:8px}
.dev-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;
  background:rgba(247,140,58,.10);border:1px solid rgba(247,140,58,.30);border-radius:12px;padding:8px 12px}
.dev-row .t{font-size:12px;font-weight:600;color:var(--warn)}
.dev-row.err{background:rgba(255,107,107,.10);border-color:rgba(255,107,107,.35)}
.dev-row.err .t{color:var(--danger)}
.dev-row button{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-2);
  background:rgba(255,255,255,.07);border:1px solid var(--hair);border-radius:9px;padding:10px 12px;
  position:relative;cursor:pointer;flex-shrink:0}
.dev-row button::after{content:'';position:absolute;inset:-4px}
/* == stage hooks: motion == */
/* D6 check-off cascade — plays inside the 26px status ring AFTER the sheet clears
   (300ms base delay covers the 280ms sheet exit). Bounded ≤26px SVG raster, fires once. */
.cel-disc{position:absolute;inset:0;border-radius:50%;background:var(--success);display:grid;place-items:center;
  transform:scale(0);animation:discPop 320ms var(--me-pop) 300ms both}
.cel-ck{stroke-dasharray:17;stroke-dashoffset:17;animation:ckDraw 240ms cubic-bezier(.65,0,.35,1) 420ms forwards}
.cel-rip{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(95,220,151,.9);
  pointer-events:none;opacity:0;animation:rip 560ms var(--me-out) 300ms forwards}
/* D6 plunger-depress commit — the Draw's liquid empties before the sheet closes */
.liq-commit{transform:scaleX(0);transition:transform 560ms var(--me-commit)}

@media (prefers-reduced-motion:reduce){
  .anim-slide-up,.anim-fade-in{animation-duration:120ms;animation-name:fadeIn}
  .vial-roll,.finger-l,.finger-r,.arrow-flow{animation:none}
  .card:active,.btn:active{transform:none}
  *{transition-duration:120ms !important}
  /* D5: sheet becomes a short opacity fade — no travel */
  .sheet{transform:none;opacity:0;transition:opacity 150ms linear}
  .sheet.open{opacity:1}
  .sheet.closing{transition:opacity 150ms linear;opacity:0}
  /* D6: cascade keeps the information, drops the travel — disc+check appear settled, no ripple */
  .cel-disc{animation:none;transform:scale(1)}
  .cel-ck{animation:none;stroke-dashoffset:0}
  .cel-rip{animation:none;opacity:0}
  .liq-commit{transition:none}
}

/* ── Oct 2026 trust release ───────────────────────────────────────────────── */
.viewing-pill{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;padding:8px 14px;border-radius:100px;border:1px solid rgba(227,200,134,.45);background:rgba(227,200,134,.12);color:var(--accent);font-weight:700;font-size:13px;cursor:pointer}
.storage-banner{position:sticky;top:0;z-index:60;display:flex;gap:10px;align-items:center;padding:10px 14px;background:#7a2e1a;color:#fff;font-size:13px;line-height:1.35}
.storage-banner button{margin-left:auto;flex-shrink:0;background:#fff;color:#7a2e1a;border:none;border-radius:8px;padding:8px 12px;font-weight:700;min-height:36px;cursor:pointer}
.plan-dis{margin:4px 0 14px;border:1px solid var(--border);border-radius:14px;background:var(--bg-card-2);overflow:hidden}
.plan-dis summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 14px;min-height:44px;cursor:pointer;font-size:12.5px;color:var(--text-dim);-webkit-tap-highlight-color:transparent}
.plan-dis summary::-webkit-details-marker{display:none}
.plan-dis-t{font-weight:800;color:var(--text);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.plan-dis-s{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-dis-c{color:var(--accent-2);font-weight:700;font-size:11.5px;white-space:nowrap}
.plan-dis[open] summary{border-bottom:1px solid var(--border)}
.plan-dis-body{padding:12px 12px 0}

/* ── Today blocks (Oct 2026 redesign, screen 1) ─────────────────────────────── */
.blk{position:relative;isolation:isolate;border-radius:20px;background:var(--glass);border:1px solid var(--border);padding:10px 12px 6px}
.blk-hd{display:flex;align-items:baseline;gap:8px;padding:2px 4px 6px}
.blk-title{font-size:14px;font-weight:800;letter-spacing:.02em}
.blk-hint{font-size:11.5px;color:var(--text-dim)}
.blk-count{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--accent)}
.blk-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border-light)}
.blk-hd + .blk-row{border-top:none}
.blk-main{flex:1;min-width:0;display:flex;align-items:center;gap:11px;min-height:56px;padding:8px 2px;background:transparent;border:none;color:var(--text);text-align:left;cursor:pointer;border-radius:12px}
.blk-main:active{background:rgba(255,255,255,.04)}
.blk-disc{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;border:1.6px solid var(--accent);background:rgba(227,200,134,.10);position:relative}
.blk-disc.done{background:var(--success);border:none}
.blk-disc.skip{border-color:var(--warn);background:rgba(247,140,58,.14)}
.blk-disc.exp{border-color:var(--warn);background:rgba(247,140,58,.08)}
.blk-disc.fut{border-color:var(--text-ghost);background:transparent}
.blk-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.blk-name{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-logged .blk-name,.is-skipped .blk-name{color:var(--text-dim);font-weight:600}
.blk-dose{font-size:12px;color:var(--text-dim);line-height:1.35}
.blk-sub.ok{color:var(--success)}.blk-sub.warn{color:var(--warn)}
.blk-row.glow .blk-disc{box-shadow:0 0 0 4px rgba(227,200,134,.14)}
.pill-log{flex-shrink:0;min-height:40px;min-width:64px;padding:0 14px;border-radius:12px;border:1px solid rgba(227,200,134,.45);background:rgba(227,200,134,.12);color:var(--accent);font-weight:700;font-size:13px;cursor:pointer}
.pill-log:active{filter:brightness(1.1)}
.pill-log.ghost{border-color:var(--border);background:rgba(255,255,255,.05);color:var(--text-2)}
.blk-time{flex-shrink:0;font-size:12px;color:var(--success);padding-right:4px}
.blk-foot{padding:10px 0 6px}
.blk-all{width:100%;min-height:50px;border-radius:14px;font-size:15px}

/* ── Plan tab, compound page, first run, text size ───────────────────────────── */
#root{zoom:var(--ts,1)}
.plan-chev{flex-shrink:0;font-size:22px;line-height:1;color:var(--text-faint);padding:0 6px 2px}
.cp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px}
.cp-stat{border-radius:14px;background:var(--bg-card-2);border:1px solid var(--border);padding:10px 10px 9px;min-width:0}
.cp-v{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-k{font-size:11px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin:0 2px 14px}
.cp-cell{display:block;height:10px;border-radius:3px;background:rgba(255,255,255,.07)}
.cp-cell.logged{background:var(--success)}.cp-cell.skipped{background:var(--warn)}.cp-cell.missed{background:rgba(255,107,107,.55)}.cp-cell.due{background:rgba(227,200,134,.6)}.cp-cell.future{background:rgba(255,255,255,.04);border:1px dashed var(--text-ghost)}
.toast button{min-height:44px}
.pill-nav-item{min-height:44px}

/* ── Printable report (History → Report): paper styling regardless of theme; printing hides the app ── */
.report-view{position:fixed;inset:0;z-index:900;overflow:auto;background:#fff;color:#10231c;font-family:-apple-system,Inter,Segoe UI,Roboto,sans-serif;-webkit-overflow-scrolling:touch}
.report-in{max-width:720px;margin:0 auto;padding:18px 20px 60px}
.report-actions{position:sticky;top:0;z-index:2;display:flex;gap:8px;justify-content:flex-end;padding:10px 0 12px;background:#fff;border-bottom:1px solid #e3dfd3;margin-bottom:14px}
.report-actions button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid #d6d1c4;background:#fff;color:#10231c;font-weight:700;font-size:13px;cursor:pointer}
.report-actions button.primary{background:#10231c;color:#fff;border-color:#10231c}
.report-view h1{margin:0;font-size:22px;font-weight:800}
.report-view h2{margin:22px 0 8px;font-size:15px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:#5b6a63}
.report-view .meta{font-size:13px;color:#5b6a63;margin-top:4px}
.report-view table{width:100%;border-collapse:collapse;font-size:12.5px}
.report-view th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6a63;border-bottom:1px solid #d6d1c4;padding:6px 6px 6px 0}
.report-view td{padding:6px 6px 6px 0;border-bottom:1px solid #eeeae0;vertical-align:top}
.report-view td.num,.report-view th.num{text-align:right;font-variant-numeric:tabular-nums}
.report-view tr.rday td{padding-top:12px;font-weight:800;border-bottom:none}
.report-view .foot{margin-top:26px;font-size:11.5px;color:#5b6a63;line-height:1.5}
@media print{
  #root > div > :not(.report-view){display:none !important}
  html,body{background:#fff !important;padding:0 !important}
  #root{zoom:1}
  .report-view{position:static;overflow:visible}
  .report-actions{display:none}
  .report-view tr{break-inside:avoid}
}
