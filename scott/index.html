<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google it.</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:white;color:black;font:24px system-ui,sans-serif}</style>
</head>
<body><main>Google it.</main>
<script>
// Do not load records or request notification permission. Existing push remains supported.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
const hour = 3600000;
let nextReminder = Date.now() + hour;
async function remind() {
  if (document.hidden || Date.now() < nextReminder) return;
  nextReminder = Date.now() + hour;
  try {
    const registration = await navigator.serviceWorker?.getRegistration();
    if (await registration?.pushManager?.getSubscription()) return;
  } catch {}
  const show = () => {
    // Share the last reminder across tabs without touching saved health records.
    try {
      const last = Number(localStorage.getItem('scott_google_it_last')) || 0;
      if (Date.now() - last < hour) return;
      localStorage.setItem('scott_google_it_last', String(Date.now()));
    } catch {}
    window.alert('Google it.');
  };
  if (navigator.locks) await navigator.locks.request('scott-google-it', show);
  else show();
}
setInterval(remind, 60000);
document.addEventListener('visibilitychange', remind);
</script>
</body>
</html>
