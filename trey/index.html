:root{
  color-scheme:dark;
  --bg:#07080b; --plate:#101318;
  --accent:#4fd6e6; --on-accent:#04211b; --ok:#5fdc97; --warn:#f4b94a; --err:#ff6b6b;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;overflow-x:hidden}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;touch-action:manipulation}
input,textarea,select{font-size:16px !important;-webkit-appearance:none;font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);letter-spacing:0}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(420px 420px at -40px 140px,rgba(86,120,255,.16),transparent 68%),
  radial-gradient(380px 380px at calc(100% + 60px) 380px,rgba(60,214,210,.13),transparent 68%),
  radial-gradient(360px 360px at 50% calc(100% + 120px),rgba(196,110,220,.11),transparent 68%)}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto}
.card{position:relative;isolation:isolate;border-radius:20px;background:var(--film),var(--sheen),var(--plate);
  border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.20),inset 0 -1px 0 rgba(0,0,0,.40),0 1px 0 rgba(0,0,0,.45),0 10px 24px -12px rgba(0,0,0,.55);
  transition:transform 120ms var(--me-out)}
.press:active{transform:scale(.98)}
.well{background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.09);border-radius:14px;color:var(--ink);

.well:focus{outline:none;border-color:rgba(79,214,230,.5);box-shadow:inset 0 1px 2px rgba(0,0,0,.45),0 0 0 3px rgba(79,214,230,.18)}

.btn-primary{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;

.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{background:rgba(255,255,255,.08);color:var(--ink4);box-shadow:none;cursor:not-allowed}

.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:2px 2px 6px;display:block}
.hdr{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;height:calc(48px + env(safe-area-inset-top));

.hdr .mark{flex:1;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink3)}
.cap{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:rgba(255,255,255,.06);

.cap::after{content:'';position:absolute;inset:-9px}
.cap.err{color:var(--err);border-color:rgba(255,107,107,.3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(79,214,230,.18);box-shadow:inset 0 0 0 1px rgba(79,214,230,.4);

.eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink3)}
.big-title{font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--ink3)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:8px 0 2px}
.day{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}

.day.sel .n{background:var(--accent);color:var(--on-accent);font-weight:700}

.day .w{font-size:10px;text-transform:uppercase;color:var(--ghost)}
.day .d{width:4px;height:4px;border-radius:50%;background:var(--ghost)}
.day .d.done{background:var(--ok)}

.sect{display:flex;align-items:center;gap:8px;margin:20px 4px 8px}

.sect .c{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dose{padding:12px;min-height:132px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.dose .r1{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rt{width:25px;height:25px;border-radius:8px;background:rgba(79,214,230,.14);box-shadow:inset 0 0 0 1px rgba(79,214,230,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rtl{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.ring{width:28px;height:28px;border-radius:50%;border:1.6px solid var(--accent);background:rgba(79,214,230,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.ring::after{content:'';position:absolute;inset:-8px}
.dose .nm{font-size:13.5px;line-height:17px;font-weight:600;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dose .hero{display:flex;align-items:baseline;gap:4px}
.dose .hv{font-family:var(--mono);font-size:22px;line-height:26px;font-weight:700;color:var(--accent)}
.dose .hu{font-family:var(--mono);font-size:13px;color:var(--ink3)}
.dose .by{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink2)}
.dose .ft{margin-top:auto;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:6px}
.dose .mt{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.glow{background:linear-gradient(180deg,rgba(79,214,230,.08),rgba(79,214,230,.015) 55%),var(--sheen),var(--plate);
  border-color:rgba(79,214,230,.30);box-shadow:inset 0 1px 0 rgba(255,255,255,.20),inset 0 -1px 0 rgba(0,0,0,.40),0 0 0 1px rgba(79,214,230,.18),0 10px 28px -10px rgba(79,214,230,.28)}
.card.logged{background:linear-gradient(180deg,rgba(95,220,151,.10),rgba(95,220,151,.02) 55%),var(--sheen),var(--plate);border-color:rgba(95,220,151,.30)}
.card.logged .ring{border:none;background:var(--ok)}
.card.logged .hv{color:rgba(255,255,255,.78)}
.card.logged .mt{color:var(--ok);font-family:var(--mono);font-size:10.5px}
@keyframes discPop{0%{transform:scale(.4)}62%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes ripOut{from{transform:scale(1);opacity:.85}to{transform:scale(2.4);opacity:0}}
.ring.pop{animation:discPop 320ms cubic-bezier(.34,1.56,.64,1)}
.ring .rip{position:absolute;inset:-2px;border-radius:50%;border:1.5px solid rgba(95,220,151,.9);pointer-events:none;animation:ripOut 560ms cubic-bezier(.16,1,.3,1) 120ms both}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:100;

.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.62);font-size:10px;font-weight:600;border-radius:24px}
.tab.on{background:rgba(79,214,230,.14);box-shadow:inset 0 0 0 1px rgba(79,214,230,.32);color:var(--accent)}
.tab svg{stroke:currentColor}
.scrim{position:fixed;inset:0;z-index:200;background:rgba(4,5,8,.62);opacity:0;pointer-events:none;transition:opacity 240ms linear}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:210;left:50%;transform:translate(-50%,103%);bottom:0;width:100%;max-width:480px;max-height:90svh;

.sheet.open{transform:translate(-50%,0)}
.sheet.closing{transition:transform 280ms var(--me-exit)}

.rangetrack{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08)}

.rangetrack .pt{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px var(--plate)}
.delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;font-weight:700;border-radius:8px;padding:3px 7px}
.delta.good{color:var(--ok);background:rgba(95,220,151,.12);border:1px solid rgba(95,220,151,.3)}

.fine{text-align:center;font-size:11px;color:var(--ink4)}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dtoggle{height:40px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--hair);color:var(--ink3);font-size:12px;font-weight:700}
.dtoggle.on{background:rgba(79,214,230,.16);border-color:rgba(79,214,230,.4);color:var(--accent)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade{animation:fadeIn 200ms var(--me-out)}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:1ms !important;animation-duration:1ms !important}
}
</style>

async function api(path, body) {
  const opt = { headers: { 'Authorization': 'Bearer ' + S.token } };
  if (body) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(API + path, opt);
  let j = null; try { j = await r.json(); } catch {}
  if (r.status === 401) { S.role = null; throw Object.assign(new Error((j && j.error) || 'Bad access code'), { auth: true }); }
  if (!r.ok) throw Object.assign(new Error((j && j.error) || ('Error ' + r.status)), { status: r.status, body: j });
  return j;
}
async function pull(silent) {
  if (!S.token) return;
  // midnight rollover: an app left open overnight must not keep logging "yesterday"
  if (!S.pinnedDate && dkey(S.viewDate) !== todayKey()) S.viewDate = new Date();
  S.sync = 'syncing'; if (!silent) render();
  try {
    const d = await api('/state');
    S.role = d.role;
    S.data = { compounds: d.compounds||[], logs: d.logs||[], labs: d.labs||[], scans: d.scans||[], _rev: d._rev||0 };
    S.sync = 'ok'; S.loaded = true;
  } catch (e) {
    S.sync = 'error';
    if (e.auth) { S.token = ''; localStorage.removeItem('trey_token'); }
  }
  render();
}
async function adminWrite(patch, okMsg) {
  try {
    await api('/admin', { baseRev: S.data._rev, ...patch });

    if (okMsg) toast(okMsg);

  }
}

/* ── trend chart: labeled y-gridlines + x dates (InBody-style) ── */
function trendSVG(pts, decimals) {
  if (!pts || pts.length < 2) return '';
  const dp = decimals == null ? 1 : decimals;
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.15, hi === lo ? 1 : 0.001);
  lo -= pad; hi += pad;
  const W = 358, H = 132, L = 10, R = 318, T = 10, B = 100;
  const X = (i) => L + (pts.length === 1 ? 0 : (i / (pts.length - 1)) * (R - L));
  const Y = (v) => B - ((v - lo) / (hi - lo)) * (B - T);
  const gridVals = [hi - pad * 0, (hi + lo) / 2, lo + pad * 0];
  const dpEff = (hi - lo) < 1 ? Math.max(dp, 2) : dp;
  const grid = [hi, (hi + lo) / 2, lo].map(v =>
    `<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${R}" y2="${Y(v).toFixed(1)}" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
     <text x="${W - 4}" y="${(Y(v) + 3.5).toFixed(1)}" fill="rgba(255,255,255,.51)" font-size="10" font-family="JetBrains Mono, ui-monospace, monospace" text-anchor="end">${v.toFixed(dpEff)}</text>`).join('');
  const line = 'M' + pts.map((p, i) => `${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' L');
  const area = line + ` L${X(pts.length - 1).toFixed(1)} ${B} L${L} ${B} Z`;
  const dots = pts.map((p, i) => i === pts.length - 1
    ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5" fill="#4fd6e6"/><circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="8" fill="none" stroke="rgba(79,214,230,.35)" stroke-width="2"/>`
    : `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="#4fd6e6" opacity=".5"/>`).join('');
  const md = (d) => { const [y, m, dd] = d.split('-'); return `${Number(m)}/${Number(dd)}`; };
  const idxs = pts.length <= 4 ? pts.map((_, i) => i) : [0, Math.floor((pts.length - 1) / 3), Math.floor(2 * (pts.length - 1) / 3), pts.length - 1];
  const xl = [...new Set(idxs)].map(i =>
    `<text x="${X(i).toFixed(1)}" y="${H - 14}" fill="rgba(255,255,255,.51)" font-size="10" font-family="JetBrains Mono, ui-monospace, monospace" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${md(pts[i].d)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%">
    ${grid}<path d="${area}" fill="rgba(79,214,230,.10)"/>
    <path d="${line}" fill="none" stroke="#4fd6e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}

function weekHTML() {
  const now = new Date();
  const start = new Date(S.viewDate); start.setDate(start.getDate() - start.getDay());
  let cells = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = dkey(d);
    const due = S.data.compounds.filter(c => dueOn(c, d));
    const done = due.length > 0 && due.every(c => logFor(c, k));
    const has = due.length > 0 && k <= todayKey();
    const sel = k === dkey(S.viewDate), today = k === todayKey();
    cells += `<button class="day ${sel?'sel':''} ${today?'today':''}" data-act="day" data-k="${k}" aria-label="${d.toDateString()}">

      <span class="d ${!has?'none':done?'done':''}"></span></button>`;
  }
  return `<div class="week">${cells}</div>`;
}

  const latest = labs[0];
  const markerSeries = (name) => [...S.data.labs].sort((a,b) => (a.date||'').localeCompare(b.date||''))
    .map(p => { const mm = (p.markers||[]).find(x => x.name === name); return mm && Number.isFinite(Number(mm.value)) ? { d: p.date, v: Number(mm.value) } : null; })
    .filter(Boolean);
  // Union view: every marker ever measured, at its most recent value (dated when older).
  const seen = new Map();
  for (const p of labs) for (const m of (p.markers || [])) {
    if (m && m.name && !seen.has(m.name)) seen.set(m.name, { m, date: p.date });
  }
  let body = '';
  if (!latest) {
    body = `<div class="fine" style="margin-top:40px">${S.role === 'admin' ? 'Add the first blood panel below.' : 'Blood panels Roman uploads will appear here.'}</div>`;
  } else {
    body = [...seen.values()].map(({ m, date }) => {
      const v = Number(m.value);
      const hasLo = m.lo != null && Number.isFinite(Number(m.lo));
      const hasHi = m.hi != null && Number.isFinite(Number(m.hi)) && Number(m.hi) !== 0;
      const lo = hasLo ? Number(m.lo) : 0, hi = hasHi ? Number(m.hi) : Math.max(v * 1.5, lo + 1);
      const span = (hi - lo) || 1, dispLo = lo - span * 0.3, dispSpan = span * 1.6;
      const pct = Math.max(3, Math.min(97, ((v - dispLo) / dispSpan) * 100));
      const zL = Math.max(0, Math.min(100, ((lo - dispLo) / dispSpan) * 100));
      const zR = hasHi ? Math.max(0, Math.min(100, ((hi - dispLo) / dispSpan) * 100)) : 100;
      const flagged = m.flag || (hasLo && v < lo) || (hasHi && v > hi);
      const col = flagged ? 'var(--warn)' : 'var(--ok)';
      const longNote = m.note && m.note.length > 42;
      const verdict = (m.note && !longNote) ? esc(m.note) : flagged ? ((hasLo && v < lo) ? 'Below range' : (hasHi && v > hi) ? 'Above range' : 'Flagged') : 'In range';
      const cardBg = flagged ? 'style="padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(244,185,74,.08),rgba(244,185,74,.015) 55%),var(--sheen),var(--plate);border-color:rgba(244,185,74,.26)"'
                            : 'style="padding:14px 16px;display:flex;flex-direction:column;gap:10px"';
      return `<div class="card" ${cardBg}>
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="flex:1;font-size:15px;font-weight:700">${esc(m.name)}${date !== latest.date ? ` <span class="mono" style="font-size:10px;font-weight:500;color:var(--ink4)">${fmtD(date)}</span>` : ''}</span>
          <span class="mono" style="font-size:20px;font-weight:700">${esc(m.value)}</span>
          <span class="mono" style="font-size:11px;color:var(--ink3)">${esc(m.unit || '')}</span>
        </div>
        <div class="rangetrack"><span class="zone" style="left:${zL}%;right:${100-zR}%"></span>
          <span class="pt" style="left:calc(${pct}% - 6px);background:${col}"></span></div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="mono" style="font-size:10.5px;color:var(--ink4)">Range ${hasLo ? esc(m.lo) : '—'}–${hasHi ? esc(m.hi) : '—'}</span>
          <span style="flex-shrink:0;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:${col};text-align:right;margin-left:12px">${flagged ? '' : I.check('#5fdc97', 12)}${verdict}</span>
        </div>
        ${longNote ? `<div style="font-size:11.5px;line-height:1.45;color:${flagged ? 'var(--warn)' : 'var(--ink3)'}">${esc(m.note)}</div>` : ''}
        ${(() => { const tr = markerSeries(m.name); return tr.length >= 2 ? `<div style="padding-top:8px;border-top:1px solid rgba(255,255,255,.08)">${trendSVG(tr, tr.every(p => Number.isInteger(p.v)) ? 0 : 1)}</div>` : ''; })()}</div>`;
    }).join('');

  }
  if (S.role === 'admin') body += `<button class="btn-primary" style="margin-top:16px" data-act="addlab">${I.plus('#04211b')} Add blood panel</button>`;
  else body += `<div class="fine" style="margin-top:14px">New panels are added by Roman.</div>`;
  return headerHTML('Blood Work', latest ? `<div class="sub" style="margin-top:4px"><span class="mono" style="color:var(--ink2)">${labs.length}</span> panels · latest <span class="mono" style="color:var(--ink2)">${fmtD(latest.date)}</span> — each marker shows its newest value; charts track it across draws.</div>` : '') +
    `<div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:12px" class="fade">${body}</div>`;
}

function progressView() {
  const scans = [...S.data.scans].sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const first = scans[0], last = scans[scans.length - 1];
  let body = '';
  if (!last) {
    body = `<div class="fine" style="margin-top:40px">${S.role === 'admin' ? 'Add the first InBody scan below.' : 'InBody scans Roman uploads will appear here.'}</div>`;
  } else {
    const dl = (v, goodDown) => {
      if (first === last || v == null || !Number.isFinite(v)) return '';
      const good = goodDown ? v <= 0 : v >= 0;
      const arrow = v <= 0 ? '<path d="M12 5v14M5 12l7 7 7-7"/>' : '<path d="M12 19V5M5 12l7-7 7 7"/>';
      return `<span class="delta ${good ? 'good' : 'warn'}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${arrow}</svg>${v > 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}</span>`;
    };
    const fmtv = (v) => (v == null || !Number.isFinite(Number(v))) ? '—' : v;
    const tile = (label, v, unit, delta) => `<div class="card" style="border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:6px">
      <span style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)">${label}</span>
      <span style="display:flex;align-items:baseline;gap:3px"><span class="mono" style="font-size:22px;font-weight:700">${v}</span><span class="mono" style="font-size:11px;color:var(--ink3)">${unit}</span></span>${delta}</div>`;
    body += `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      ${tile('Weight (lb)', fmtv(last.weightLb), '', dl(first ? last.weightLb - first.weightLb : null, true))}
      ${tile('Skeletal Muscle Mass (lb)', fmtv(last.smmLb), '', dl(first ? last.smmLb - first.smmLb : null, false))}
      ${tile('Percent Body Fat (%)', fmtv(last.pbfPct), '', dl(first ? last.pbfPct - first.pbfPct : null, true))}
    </div>`;
    const series = (key) => scans.filter(x => Number.isFinite(Number(x[key]))).map(x => ({ d: x.date, v: Number(x[key]) }));
    const w = series('weightLb'), sm = series('smmLb'), bf = series('pbfPct');
    body += chartCard('Weight (lb)', w.length + ' scans', trendSVG(w, 1));
    body += chartCard('Skeletal Muscle Mass (lb)', sm.length + ' scans', trendSVG(sm, 1));
    body += chartCard('Percent Body Fat (%)', bf.length + ' scans', trendSVG(bf, 1));
    const row = (l, v, u) => `<div style="display:flex;align-items:center;gap:10px">
      <span style="flex:1;font-size:13px;color:var(--ink2)">${l}</span>
      <span class="mono" style="font-size:15px;font-weight:700">${v != null ? v : '—'}</span>
      <span class="mono" style="font-size:11px;color:var(--ink3)">${u}</span></div>`;
    body += `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:12px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:13px;font-weight:700">This scan</span>
        <span class="mono" style="font-size:10.5px;color:var(--ink4)">${fmtD(last.date)}</span></div>
      ${row('Body fat mass', last.bfmLb, 'lb')}
      ${row('Visceral fat level', last.vfl, (Number(last.vfl) <= 9 ? '· healthy' : '· high'))}
      ${row('Total body water', last.tbwLb, 'lb')}
      ${row('Basal metabolic rate', last.bmrKcal, 'kcal')}
    </div>`;
  }
  if (S.role === 'admin') body += `<button class="btn-primary" style="margin-top:16px" data-act="addscan">${I.plus('#04211b')} Add InBody scan</button>`;
  else body += `<div class="fine" style="margin-top:14px">Scans are uploaded by Roman from the InBody H40.</div>`;
  return headerHTML('Progress', last ? `<div class="sub" style="margin-top:4px">InBody H40 · last scan <span class="mono" style="color:var(--ink2)">${fmtD(last.date)}</span></div>` : '') +
    `<div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:0" class="fade">${body}</div>`;
}

function setupView() {
  return `
  <div style="min-height:80vh;display:flex;flex-direction:column;justify-content:center;padding:0 24px">
    <div class="eyebrow" style="text-align:center">PROTOCOL</div>
    <div class="big-title" style="text-align:center;margin-top:4px">Welcome</div>
    <div class="sub" style="text-align:center;margin-top:8px">Enter the access code Roman gave you.</div>
    <input class="well mono" id="tok" style="margin-top:24px;text-align:center" placeholder="access code" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button class="btn-primary" style="margin-top:12px" data-act="connect">Connect</button>
    <div class="fine" id="seterr" style="margin-top:12px;color:var(--err)"></div>
  </div>`;
}

function tabbarHTML() {
  const T = [['protocol','Protocol'],['library','Library'],['labs','Blood Work'],['progress','Progress']];
  return `<nav class="tabbar" role="tablist">${T.map(([id,l]) =>
    `<button class="tab ${S.tab === id ? 'on' : ''}" role="tab" aria-selected="${S.tab === id}" data-act="tab" data-tab="${id}">${I.tabs[id === 'labs' ? 'labs' : id]}${l}</button>`).join('')}</nav>`;
}

function render() {
  const app = $('#app');
  if (!S.token) { app.innerHTML = setupView(); return; }
  if (!S.loaded) { app.innerHTML = `<div class="hdr"><span class="mark">PROTOCOL</span></div><div class="fine" style="margin-top:80px">Loading…</div>`; return; }
  const v = { protocol: protocolView, library: libraryView, labs: labsView, progress: progressView }[S.tab];
  app.innerHTML = v() + tabbarHTML();
}

/* ════════ sheet plumbing ════════ */
let sheetTimer = null;
function openSheet(html, onmount) {
  const sh = $('#sheet'), sc = $('#scrim');
  clearTimeout(sheetTimer);
  sh.classList.remove('closing');
  sh.innerHTML = `<button class="grab" data-act="closesheet" aria-label="Close"><i></i></button>` + html;
  sc.classList.add('on');
  requestAnimationFrame(() => requestAnimationFrame(() => { sh.classList.add('open'); sh.focus(); }));
  sheetTimer = setTimeout(() => sh.classList.add('settled'), 460);
  if (onmount) onmount(sh);
}
function closeSheet() {
  const sh = $('#sheet'), sc = $('#scrim');
  clearTimeout(sheetTimer);
  sh.classList.add('closing'); sh.classList.remove('open', 'settled');
  sc.classList.remove('on');
  sheetTimer = setTimeout(() => { sh.innerHTML = ''; sh.classList.remove('closing'); }, 380);
}
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

/* ════════ The Draw (dose sheet) ════════ */
function openDose(c) {
  const k = dkey(S.viewDate);
  const isPrn = !((c.schedule && c.schedule.days) || []).length;
  const found = isPrn ? null : logFor(c, k);   // PRN: every log is a new entry
  if (found && S.role !== 'admin' && found.by && found.by !== S.role) {
    return toast(`Already logged by Roman today — ask him to change it.`);
  }
  const existing = found;
  const conc = concOf(c);
  const rec = Number(c.doseMcg) || 0;
  const uL = unitLabel(c);
  const recU = conc > 0 ? rec / conc : 0;
  const maxU = conc > 0 ? Math.max(30, Math.ceil((recU * 2.2) / 10) * 10) : 0;
  let units = conc > 0 ? (existing ? (existing.doseMcg / conc) : recU) : 0;
  let mcg = existing ? existing.doseMcg : rec;
  const showMg = c.unit !== 'IU' && mcg >= 1000; // single source for display unit AND parse scale

  const draw = conc > 0;
  const html = `
  <div class="sheet-body">
    <div>
      <div style="font-size:22px;line-height:27px;font-weight:700;letter-spacing:-.015em">${esc(c.name)}</div>
      <div style="font-size:13px;color:var(--ink3);margin-top:3px">${esc(c.timing || 'Daily')} · Roman recommends <span class="mono" style="color:var(--ink2)">${fmtAmt(rec, c.unit)}</span></div>
    </div>
    <div class="card" style="border-radius:16px;padding:14px 14px 12px">
      <div class="lbl" style="margin:0 0 6px">The Draw</div>
      <div style="display:flex;align-items:baseline;gap:6px">
        <input class="readout" id="dv" inputmode="decimal" value="${draw ? units.toFixed(1) : (c.unit === 'IU' ? mcg : (showMg ? (mcg/1000) : mcg))}" aria-label="Dose">
        <span style="font-size:16px;color:var(--ink3)">${draw ? 'u' : (c.unit === 'IU' ? 'IU' : (showMg ? 'mg' : 'mcg'))}</span>
        <span class="mono" id="conv" style="margin-left:auto;font-size:13px;color:var(--ink2)"></span>
      </div>
      ${draw ? `
      <div style="display:flex;align-items:center;gap:8px;margin-top:12px">
        <button class="step" id="dec" aria-label="Decrease one unit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.82)" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <svg id="barrel" viewBox="0 0 266 64" style="flex:1;min-width:0;display:block;touch-action:none;cursor:grab;overflow:visible">
          <rect x="8" y="10" width="250" height="26" rx="4" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.35)" stroke-width="1.3"/>
          <rect id="liq" x="9.5" y="11.5" width="0" height="23" fill="rgba(79,214,230,.42)"/>
          <rect id="men" x="9" y="11.5" width="2" height="23" fill="#4fd6e6"/>
          <rect id="plg" x="7" y="6" width="6" height="34" rx="2" fill="#4fd6e6"/>
          <g id="ticks"></g><g id="tlbl"></g>
        </svg>
        <button class="step" id="inc" aria-label="Increase one unit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4fd6e6" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="mono" style="font-size:11px;color:var(--ink3);margin-top:8px">${reconLine(c)} · snaps 0.5u · drag the plunger</div>` : ''}
      ${(c.ingredients || []).length ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)">
        <div style="font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px">In this shot</div>
        <div id="shotmix" style="display:flex;flex-direction:column;gap:7px"></div></div>` : ''}
      <div id="guard"></div>
    </div>
    <div>
      <span class="lbl">Time</span>
      <div class="chiprow" id="times"></div>
    </div>
  </div>
  <div class="sheet-foot">
    ${existing ? `<button class="btn-ghost" id="undo" style="color:var(--err)">Remove</button>` : `<button class="btn-ghost" id="cancel">Cancel</button>`}
    <button class="btn-primary" id="go" style="flex:1;height:52px"></button>
  </div>`;

  openSheet(html, (sh) => {
    const dv = $('#dv', sh), conv = $('#conv', sh), guard = $('#guard', sh), go = $('#go', sh);
    const isTodayView = k === todayKey();
    let when = existing ? existing.datetime : (isTodayView ? nowLocal() : k + 'T08:00');
    const times = $('#times', sh);
    const timeChips = (isTodayView ? [['Now', nowLocal()]] : []).concat([['Morning', k + 'T08:00'], ['Evening', k + 'T19:00'], ['Bedtime', k + 'T22:00']]);
    const renderTimes = () => { times.innerHTML = timeChips.map(([l, v]) =>
      `<button class="chip ${when === v ? 'sel' : ''}" data-t="${v}">${l}${when === v ? `<span class="mono" style="font-size:10px">${new Date(v).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span>` : ''}</button>`).join('');
      times.querySelectorAll('.chip').forEach(b => b.onclick = () => { when = b.dataset.t; renderTimes(); });
    };
    renderTimes();

    const X0 = 8, W = 250;
    const buildTicks = () => {
      if (!draw) return;
      let t = '', l = '';
      const step = maxU <= 30 ? 1 : maxU <= 60 ? 2 : 5;
      for (let u = 0; u <= maxU; u += step) {
        const x = X0 + (u / maxU) * W, major = u % (step * 5) === 0;
        t += `<line x1="${x}" y1="40" x2="${x}" y2="${major ? 48 : 44}" stroke="rgba(255,255,255,${major ? '.45' : '.30'})" stroke-width="1"/>`;
        if (major) l += `<text x="${x}" y="60" fill="rgba(255,255,255,.51)" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" text-anchor="middle">${u}</text>`;
      }
      $('#ticks', sh).innerHTML = t; $('#tlbl', sh).innerHTML = l;
    };
    buildTicks();

    const upd = (fromInput) => {
      if (draw) {
        units = Math.max(0, Math.min(maxU, units));
        mcg = Math.round(units * conc);
        if (!fromInput) dv.value = units.toFixed(1);
        conv.textContent = `${fmtAmt(mcg, c.unit)} · ${(units / 100).toFixed(3)} mL`;
        const fill = Math.max(0, Math.min(W - 3, (units / maxU) * (W - 3)));
        $('#liq', sh).setAttribute('width', fill);
        $('#men', sh).setAttribute('x', 9.5 + fill - 1);
        $('#plg', sh).setAttribute('x', Math.min(252, 9.5 + fill - 2));
      } else {
        conv.textContent = fmtAmt(mcg, c.unit);
      }
      const mix = $('#shotmix', sh);
      if (mix && (c.ingredients || []).length) {
        const total = c.ingredients.reduce((a, i) => a + (Number(i.mg) || 0), 0) || 1;
        mix.innerHTML = c.ingredients.map(i => {
          const frac = (Number(i.mg) || 0) / total;
          return `<div style="display:flex;align-items:center;gap:8px">
            <span style="flex:1;font-size:12px;color:var(--ink2)">${esc(i.name)} <span style="color:var(--ink4)">· ${Math.round(frac*100)}%</span></span>
            <span class="mono" style="font-size:13px;font-weight:700;color:var(--accent)">${fmtMcg(mcg * frac)}</span></div>`;
        }).join('');
      }
      const ratio = rec > 0 ? mcg / rec : 1;
      const blocked = rec > 0 && ratio >= 5;
      const off = !blocked && rec > 0 && Math.abs(mcg - rec) / rec > 0.25;
      dv.classList.toggle('warned', off); dv.classList.toggle('blocked', blocked);
      const men = $('#men', sh), plg = $('#plg', sh);
      if (men) { const col = blocked ? '#ff6b6b' : off ? '#f4b94a' : '#4fd6e6'; men.setAttribute('fill', col); plg.setAttribute('fill', col); }
      guard.innerHTML = blocked
        ? `<div class="advice err"><span class="t">Blocked at <span class="mono">${ratio.toFixed(1)}×</span> Roman's dose — talk to Roman</span>
           <button class="btn-ghost" id="rst" style="height:44px;font-size:12px;font-family:var(--mono)">Reset</button></div>`
        : off
        ? `<div class="advice"><span class="t"><span class="mono">${ratio.toFixed(1)}×</span> Roman's recommended dose</span>
           <button class="btn-ghost" id="rst" style="height:44px;font-size:12px;font-family:var(--mono)">Reset to ${draw ? (Math.round(recU * 2) / 2) + 'u' : fmtAmt(rec, c.unit)}</button></div>`
        : '';
      const r = $('#rst', sh); if (r) r.onclick = () => { units = recU; mcg = rec; upd(); };
      go.disabled = blocked || !(mcg > 0);
      go.innerHTML = blocked ? 'Blocked by the dose gate'
        : `${existing ? 'Save' : 'Log'} <span class="mono" style="margin-left:6px">${draw ? (Math.round(units * 10) / 10) + 'u · ' : ''}${fmtAmt(mcg, c.unit)}</span>`;
    };

    if (draw) {
      $('#inc', sh).onclick = () => { units = Math.round((units + 1) * 2) / 2; upd(); };
      $('#dec', sh).onclick = () => { units = Math.round((units - 1) * 2) / 2; upd(); };
      const barrel = $('#barrel', sh);
      let dragging = false;
      const toUnits = (e) => { const r = barrel.getBoundingClientRect();
        return ((((e.clientX - r.left) / r.width) * 266) - X0) / W * maxU; };
      barrel.addEventListener('pointerdown', (e) => { dragging = true; barrel.setPointerCapture(e.pointerId); units = toUnits(e); upd(); });
      barrel.addEventListener('pointermove', (e) => { if (dragging) { units = toUnits(e); upd(); } });
      barrel.addEventListener('pointerup', () => { dragging = false; units = Math.round(units * 2) / 2; upd(); });
      dv.addEventListener('input', () => { const v = parseFloat(dv.value); if (Number.isFinite(v)) { units = v; upd(true); } });
      dv.addEventListener('blur', () => { units = Math.round(units * 2) / 2; upd(); });
    } else {
      dv.addEventListener('input', () => { const v = parseFloat(dv.value); if (Number.isFinite(v)) { mcg = c.unit === 'IU' ? v : (showMg ? v * 1000 : v); upd(true); } });
    }
    upd();

    const cancel = $('#cancel', sh); if (cancel) cancel.onclick = closeSheet;
    const undo = $('#undo', sh); if (undo) undo.onclick = async () => {
      try { await api('/log', { deleteId: existing.id }); closeSheet(); await pull(true); toast('Removed'); }
      catch (e) { toast(e.message); }
    };
    go.onclick = async () => {
      go.disabled = true;
      // re-resolve against FRESH state: a background pull may have brought a same-day log in
      const live = isPrn ? null : logFor(c, k);
      if (live && S.role !== 'admin' && live.by && live.by !== S.role) {
        go.disabled = false; closeSheet();
        return toast('Already logged by Roman today — ask him to change it.');
      }
      const entry = { id: existing ? existing.id : (live ? live.id : uid()), compoundId: c.id, datetime: when, doseMcg: Math.round(mcg), units: draw ? Math.round(units * 10) / 10 : null };
      try {
        await api('/log', { log: entry });
        // instant confirmation: update locally + pop the check, then reconcile in background
        S.data.logs = [{ ...entry, by: S.role }, ...S.data.logs.filter(l => l.id !== entry.id)];
        flashId = c.id; setTimeout(() => { flashId = null; }, 1600);
        closeSheet(); render();
        // reconcile + self-heal: KV writes from two devices in the same instant can drop one —
        // if ours vanished from the pulled state, post it once more.
        pull(true).then(async () => {
          if (!S.data.logs.some(l => l.id === entry.id)) {
            try { await api('/log', { log: entry }); await pull(true); } catch (e) {}
          }
        });
        toast(`✓ ${c.name} · ${fmtAmt(entry.doseMcg, c.unit)}`, async () => {
          try { await api('/log', { deleteId: entry.id }); await pull(true); } catch (e) { toast(e.message); }
        });
      } catch (e) { go.disabled = false; toast(e.message); }
    };
  });
}

/* ════════ admin forms ════════ */
function compForm(c) {
  const isNew = !c;
  c = c || { id: 'c_' + uid(), name: '', category: '', purpose: '', benefits: [], doseMcg: '', mcgPerUnit: '', timing: 'Morning', schedule: { days: [0,1,2,3,4,5,6] }, active: true };
  const days = (c.schedule && c.schedule.days) || [0,1,2,3,4,5,6];
  const html = `
  <div class="sheet-body">
    <div style="font-size:22px;font-weight:700">${isNew ? 'Add compound' : 'Edit ' + esc(c.name)}</div>
    <div><span class="lbl">Name</span>
      <input class="well" id="f-name" list="libnames" value="${esc(c.name)}" placeholder="Start typing — common ones autofill">
      <datalist id="libnames">${Object.keys(LIB).map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><span class="lbl">Category</span><input class="well" id="f-cat" value="${esc(c.category)}"></div>
      <div><span class="lbl">Timing</span><select class="well" id="f-time">
        ${['Morning','Evening','Nightly','As needed'].map(t => `<option ${c.timing === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><span class="lbl">Dose (<span id="f-ul">${c.unit === 'IU' ? 'IU' : 'mcg'}</span>)</span><input class="well mono" id="f-dose" inputmode="numeric" value="${esc(c.doseMcg)}"></div>
      <div><span class="lbl">Unit</span><select class="well" id="f-unit"><option ${c.unit !== 'IU' ? 'selected' : ''}>mcg</option><option ${c.unit === 'IU' ? 'selected' : ''}>IU</option></select></div>
    </div>
    <div><span class="lbl">Reconstitution — so you remember the mix</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <input class="well mono" id="f-vial" inputmode="decimal" value="${esc(c.vialAmount || '')}" placeholder="Vial (${c.unit === 'IU' ? 'IU' : 'mg'})" aria-label="Vial amount">
        <input class="well mono" id="f-bac" inputmode="decimal" value="${esc(c.bacMl || '')}" placeholder="BAC water (mL)" aria-label="Bacteriostatic water in milliliters">
      </div>
      <div class="fine" id="f-calc" style="text-align:left;margin-top:6px"></div></div>
    <div><span class="lbl">Per-unit strength (auto from vial · manual if empty)</span><input class="well mono" id="f-conc" inputmode="decimal" value="${esc(c.mcgPerUnit)}" placeholder="0 = no syringe"></div>
    <div><span class="lbl">Blend ingredients — one per line as "Name: mg" (optional)</span>
      <textarea class="well mono" id="f-ing" rows="3" placeholder="GHK-Cu: 50">${esc((c.ingredients || []).map(i => i.name + ': ' + i.mg).join('\n'))}</textarea></div>
    <div><span class="lbl">Days</span><div class="days7" id="f-days">
      ${'SMTWTFS'.split('').map((d, i) => `<button class="dtoggle ${days.includes(i) ? 'on' : ''}" data-d="${i}">${d}</button>`).join('')}</div>
      <div class="fine" style="text-align:left;margin-top:6px">No days selected = as-needed only.</div></div>
    <div><span class="lbl">What it does (shown in Library)</span><textarea class="well" id="f-purp" rows="3">${esc(c.purpose)}</textarea></div>
    <div><span class="lbl">Benefits — one per line</span><textarea class="well" id="f-ben" rows="3">${esc((c.benefits || []).join('\n'))}</textarea></div>
  </div>
  <div class="sheet-foot">
    ${isNew ? `<button class="btn-ghost" id="f-cancel">Cancel</button>` : `<button class="btn-ghost" id="f-deact" style="color:var(--warn)">${c.active === false ? 'Reactivate' : 'Deactivate'}</button>`}
    <button class="btn-primary" id="f-save" style="flex:1">Save</button>
  </div>`;
  openSheet(html, (sh) => {
    const nameEl = $('#f-name', sh);
    nameEl.addEventListener('change', () => {
      const lib = LIB[nameEl.value.trim()];
      if (lib && isNew) {
        $('#f-cat', sh).value = lib.category; $('#f-time', sh).value = lib.timing;
        $('#f-dose', sh).value = lib.doseMcg; $('#f-conc', sh).value = lib.mcgPerUnit;
        $('#f-purp', sh).value = lib.purpose; $('#f-ben', sh).value = lib.benefits.join('\n');
      }
    });
    sh.querySelectorAll('.dtoggle').forEach(b => b.onclick = () => b.classList.toggle('on'));
    const calc = () => {
      const unit = $('#f-unit', sh).value;
      $('#f-ul', sh).textContent = unit;
      $('#f-vial', sh).placeholder = 'Vial (' + (unit === 'IU' ? 'IU' : 'mg') + ')';
      const v = parseFloat($('#f-vial', sh).value), b = parseFloat($('#f-bac', sh).value);
      if (v > 0 && b > 0) {
        const per = unit === 'IU' ? v / (b * 100) : (v * 1000) / (b * 100);
        $('#f-conc', sh).value = Math.round(per * 100) / 100;
        $('#f-calc', sh).textContent = `= ${Math.round(per * 100) / 100} ${unit} per syringe unit (${b} mL = ${b * 100} units)`;
      } else $('#f-calc', sh).textContent = 'Leave empty until you reconstitute — doses log by amount only.';
    };
    ['f-unit','f-vial','f-bac'].forEach(id => $('#' + id, sh).addEventListener('input', calc));
    $('#f-unit', sh).addEventListener('change', calc);
    calc();
    const fc = $('#f-cancel', sh); if (fc) fc.onclick = closeSheet;
    const fd = $('#f-deact', sh); if (fd) fd.onclick = async () => {
      const next = S.data.compounds.map(x => x.id === c.id ? { ...x, active: x.active === false } : x);
      if (await adminWrite({ compounds: next }, c.active === false ? 'Reactivated' : 'Deactivated')) closeSheet();
    };
    $('#f-save', sh).onclick = async () => {
      const btn = $('#f-save', sh); if (btn.disabled) return; btn.disabled = true;
      const done = (ok) => { if (!ok) btn.disabled = false; };
      const name = nameEl.value.trim();
      const dose = parseFloat($('#f-dose', sh).value);
      if (!name) { done(false); return toast('Name it first'); }
      if (!Number.isFinite(dose) || dose <= 0) { done(false); return toast('Set a dose first'); }
      const upd = {
        ...c, name, category: $('#f-cat', sh).value.trim(), timing: $('#f-time', sh).value,
        unit: $('#f-unit', sh).value === 'IU' ? 'IU' : 'mcg',
        vialAmount: parseFloat($('#f-vial', sh).value) || 0,
        bacMl: parseFloat($('#f-bac', sh).value) || 0,
        ingredients: $('#f-ing', sh).value.split('\n').map(l => { const m = l.split(':'); const nm = (m[0]||'').trim(); const mg = parseFloat(m[1]); return nm && Number.isFinite(mg) ? { name: nm, mg } : null; }).filter(Boolean),
        doseMcg: Math.round(dose), mcgPerUnit: parseFloat($('#f-conc', sh).value) || 0,
        purpose: $('#f-purp', sh).value.trim(),
        benefits: $('#f-ben', sh).value.split('\n').map(s => s.trim()).filter(Boolean),
        schedule: { days: [...sh.querySelectorAll('.dtoggle.on')].map(b => Number(b.dataset.d)).sort() },
      };
      const next = isNew ? [...S.data.compounds, upd] : S.data.compounds.map(x => x.id === c.id ? upd : x);
      const ok = await adminWrite({ compounds: next }, isNew ? `Added ${name}` : 'Saved');
      done(ok); if (ok) closeSheet();
    };
  });
}

function labForm() {
  const rowHTML = () => `<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:6px" class="mrow">
    <input class="well" placeholder="Marker" style="padding:10px 10px">
    <input class="well mono" placeholder="Value" inputmode="decimal" style="padding:10px 8px">
    <input class="well" placeholder="Unit" style="padding:10px 8px">
    <input class="well mono" placeholder="Low" inputmode="decimal" style="padding:10px 8px">
    <input class="well mono" placeholder="High" inputmode="decimal" style="padding:10px 8px">
  </div>`;
  const html = `
  <div class="sheet-body">
    <div style="font-size:22px;font-weight:700">Add blood panel</div>
    <div><span class="lbl">Panel date</span><input class="well mono" id="l-date" type="date" value="${todayKey()}"></div>
    <div><span class="lbl">Markers</span><div id="l-rows" style="display:flex;flex-direction:column;gap:8px">${rowHTML()}${rowHTML()}${rowHTML()}</div>
      <button class="btn-ghost" id="l-more" style="margin-top:8px;height:44px">+ Another marker</button></div>
  </div>
  <div class="sheet-foot"><button class="btn-ghost" id="l-cancel">Cancel</button>
    <button class="btn-primary" id="l-save" style="flex:1">Save panel</button></div>`;
  openSheet(html, (sh) => {
    $('#l-more', sh).onclick = () => $('#l-rows', sh).insertAdjacentHTML('beforeend', rowHTML());
    $('#l-cancel', sh).onclick = closeSheet;
    $('#l-save', sh).onclick = async () => {
      const btn = $('#l-save', sh); if (btn.disabled) return; btn.disabled = true;
      const pf = (x) => { const f = parseFloat(x); return Number.isFinite(f) ? f : null; };
      const markers = [...sh.querySelectorAll('.mrow')].map(r => {
        const [n, v, u, lo, hi] = [...r.querySelectorAll('input')].map(i => i.value.trim());
        return n && v ? { name: n, value: parseFloat(v), unit: u, lo: pf(lo), hi: pf(hi) } : null;
      }).filter(Boolean);
      if (!markers.length) { btn.disabled = false; return toast('Add at least one marker'); }
      const next = [...S.data.labs, { id: 'lab_' + uid(), date: $('#l-date', sh).value, markers }];
      const ok = await adminWrite({ labs: next }, 'Panel added');
      if (!ok) btn.disabled = false; else closeSheet();
    };
  });
}

function scanForm() {
  const F = [['weightLb','Weight (lb)'],['smmLb','Skeletal muscle mass (lb)'],['pbfPct','Body fat (%)'],['bfmLb','Body fat mass (lb)'],['vfl','Visceral fat level'],['tbwLb','Total body water (lb)'],['bmrKcal','BMR (kcal)']];
  const html = `
  <div class="sheet-body">
    <div style="font-size:22px;font-weight:700">Add InBody scan</div>
    <div><span class="lbl">Scan date</span><input class="well mono" id="s-date" type="date" value="${todayKey()}"></div>
    ${F.map(([k, l]) => `<div><span class="lbl">${l}</span><input class="well mono" id="s-${k}" inputmode="decimal"></div>`).join('')}
  </div>
  <div class="sheet-foot"><button class="btn-ghost" id="s-cancel">Cancel</button>
    <button class="btn-primary" id="s-save" style="flex:1">Save scan</button></div>`;
  openSheet(html, (sh) => {
    $('#s-cancel', sh).onclick = closeSheet;
    $('#s-save', sh).onclick = async () => {
      const btn = $('#s-save', sh); if (btn.disabled) return; btn.disabled = true;
      const scan = { id: 'scan_' + uid(), date: $('#s-date', sh).value };
      let any = false;
      F.forEach(([k]) => { const v = parseFloat($('#s-' + k, sh).value); if (Number.isFinite(v)) { scan[k] = v; any = true; } });
      if (!any) { btn.disabled = false; return toast('Enter the scan numbers'); }
      const next = [...S.data.scans, scan];
      const ok = await adminWrite({ scans: next }, 'Scan added');
      if (!ok) btn.disabled = false; else closeSheet();
    };
  });
}

/* ════════ actions ════════ */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'tab') { S.tab = el.dataset.tab; render(); }
  else if (act === 'day') { const [y, m, d] = el.dataset.k.split('-').map(Number); S.viewDate = new Date(y, m - 1, d); S.pinnedDate = dkey(S.viewDate) !== todayKey(); render(); }
  else if (act === 'pull') pull();
  else if (act === 'closesheet') closeSheet();
  else if (act === 'opendose') {
    const c = S.data.compounds.find(x => x.id === el.dataset.id);
    if (c) openDose(c);
  }
  else if (act === 'editcomp') { e.stopPropagation(); const c = S.data.compounds.find(x => x.id === el.dataset.id); if (c) compForm(c); }
  else if (act === 'addcomp') compForm(null);
  else if (act === 'addlab') labForm();
  else if (act === 'addscan') scanForm();
  else if (act === 'connect') {
    const tok = $('#tok').value.trim();
    if (!tok) return;
    S.token = tok;
    try {
      const d = await api('/state');
      localStorage.setItem('trey_token', tok);
      S.role = d.role;
      S.data = { compounds: d.compounds||[], logs: d.logs||[], labs: d.labs||[], scans: d.scans||[], _rev: d._rev||0 };
      S.loaded = true; S.sync = 'ok';
      render();
      toast(d.role === 'admin' ? 'Connected as Roman (admin)' : 'Connected as Trey');
    } catch (err) {
      S.token = '';
      const se = $('#seterr'); if (se) se.textContent = err.message || 'That code didn’t work.';
    }
  }
}, true);
// stop card-tap when tapping the admin pencil inside it
document.addEventListener('click', (e) => {
  const p = e.target.closest('[data-act="editcomp"]');
  if (p) e.stopPropagation();
}, true);

/* ════════ boot ════════ */
render();
if (S.token) pull();
</script>
</body>
</html>
