<style>
/* ═══ Trey Protocol — Emerald Club × Vitae Lab (approved design D4, 2026-08-28) ═══ */
:root{
  color-scheme:dark;
  --bg:#0e2820; --plate:#132e24;
  --accent:#e3c886; --on-accent:#122417; --teal:#35b3a0; --ok:#5fdc97; --warn:#f78c3a; --err:#ff6b6b;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --ink:#f4f7f9; --ink2:rgba(255,255,255,.82); --ink3:rgba(255,255,255,.62); --ink4:rgba(255,255,255,.51); --ghost:rgba(255,255,255,.34);
  --hair:rgba(255,255,255,.10); --hair2:rgba(255,255,255,.14);
  --film:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035) 42%,rgba(255,255,255,.02));
  --sheen:linear-gradient(165deg,rgba(227,200,134,.06),rgba(53,179,160,.02) 40%,rgba(0,0,0,0) 70%);
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --me-out:cubic-bezier(.16,1,.3,1); --me-sheet:cubic-bezier(.32,.72,0,1); --me-exit:cubic-bezier(.4,0,.7,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;overflow-x:hidden}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;touch-action:manipulation}
input,textarea,select{font-size:16px !important;-webkit-appearance:none;font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);letter-spacing:0}
.serif{font-family:var(--serif)}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(460px 380px at 50% -80px,rgba(227,200,134,.12),transparent 68%),
  radial-gradient(380px 380px at calc(100% + 60px) 380px,rgba(53,179,160,.10),transparent 68%),
  radial-gradient(360px 360px at 50% calc(100% + 120px),rgba(9,20,14,.55),transparent 68%)}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto}
.card{position:relative;isolation:isolate;border-radius:20px;background:var(--film),var(--sheen),var(--plate);
  border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.20),inset 0 -1px 0 rgba(0,0,0,.40),0 1px 0 rgba(0,0,0,.45),0 10px 24px -12px rgba(0,0,0,.55);
  transition:transform 120ms var(--me-out)}
.press:active{transform:scale(.98)}
.well{background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.09);border-radius:14px;color:var(--ink);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.05);padding:12px 14px;width:100%}
.well:focus{outline:none;border-color:rgba(227,200,134,.5);box-shadow:inset 0 1px 2px rgba(0,0,0,.45),0 0 0 3px rgba(227,200,134,.18)}
.well::placeholder{color:rgba(255,255,255,.40)}
.btn-primary{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:linear-gradient(180deg,#eed9a4,#d8b878);color:var(--on-accent);font-size:16px;font-weight:600;
  box-shadow:0 8px 22px -6px rgba(227,200,134,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{background:rgba(255,255,255,.08);color:var(--ink4);box-shadow:none;cursor:not-allowed}
.btn-ghost{height:48px;padding:0 18px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.07);border:1px solid var(--hair);color:var(--ink);font-size:15px;font-weight:600}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:2px 2px 6px;display:block}
.hdr{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;height:calc(48px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 12px 0;background:rgba(10,26,20,.62);
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.32)}
.hdr .mark{flex:1;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink3)}
.cap{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:rgba(255,255,255,.06);
  border:1px solid var(--hair);font-family:var(--mono);font-size:11px;color:var(--ink3);position:relative}
.cap::after{content:'';position:absolute;inset:-9px}
.cap.err{color:var(--err);border-color:rgba(255,107,107,.3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.avatar{min-width:32px;width:auto;padding:0 10px;height:32px;border-radius:999px;background:rgba(227,200,134,.18);box-shadow:inset 0 0 0 1px rgba(227,200,134,.4);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent)}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink3)}
.big-title{font-family:var(--serif);font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--ink3)}
.week{display:grid;grid-template-columns:22px repeat(7,minmax(0,1fr)) 22px;margin:8px 0 2px;align-items:center}
.wknav{height:56px;display:flex;align-items:center;justify-content:center;color:var(--ink4);position:relative}
.wknav::after{content:'';position:absolute;inset:-4px 0}
.wknav[data-dir="-1"]::after{left:-12px}
.wknav[data-dir="1"]::after{right:-12px}
.wknav:active{color:var(--accent)}
.wknav:disabled{opacity:0;pointer-events:none}
.day{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day .n{font-family:var(--mono);font-size:13px;font-weight:600;color:rgba(255,255,255,.78);width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.day.sel .n{background:var(--accent);color:var(--on-accent);font-weight:700}
.day.today:not(.sel) .n{color:var(--accent)}
.day .w{font-size:10px;text-transform:uppercase;color:var(--ghost)}
.day .d{width:4px;height:4px;border-radius:50%;background:var(--ghost)}
.day .d.done{background:var(--ok)}
.day .d.none{background:transparent}
.sect{display:flex;align-items:center;gap:8px;margin:20px 4px 8px}
.sect .t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.sect .r{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent)}
.sect .c{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dose{padding:12px;min-height:132px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.dose .r1{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rt{width:25px;height:25px;border-radius:8px;background:rgba(227,200,134,.14);box-shadow:inset 0 0 0 1px rgba(227,200,134,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rtl{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.ring{width:28px;height:28px;border-radius:50%;border:1.6px solid var(--accent);background:rgba(227,200,134,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.ring::after{content:'';position:absolute;inset:-8px}
.dose .nm{font-family:var(--serif);font-size:17px;line-height:19px;font-weight:600;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dose .hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px}
.dose .hv{font-family:var(--mono);font-size:22px;line-height:26px;font-weight:700;color:var(--accent)}
.dose .hu{font-family:var(--mono);font-size:13px;color:var(--ink3)}
.dose .by{margin-left:auto;white-space:nowrap;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink2)}
.dose .ft{margin-top:auto;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:6px}
.dose .mt{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.glow{background:linear-gradient(180deg,rgba(227,200,134,.08),rgba(227,200,134,.015) 55%),var(--sheen),var(--plate);
  border-color:rgba(227,200,134,.30);box-shadow:inset 0 1px 0 rgba(255,255,255,.20),inset 0 -1px 0 rgba(0,0,0,.40),0 0 0 1px rgba(227,200,134,.18),0 10px 28px -10px rgba(227,200,134,.28)}
.card.logged{background:linear-gradient(180deg,rgba(95,220,151,.10),rgba(95,220,151,.02) 55%),var(--sheen),var(--plate);border-color:rgba(95,220,151,.30)}
.card.logged .ring{border:none;background:var(--ok)}
.card.logged .hv{color:rgba(255,255,255,.78)}
.card.logged .mt{color:var(--ok);font-family:var(--mono);font-size:10.5px}
@keyframes discPop{0%{transform:scale(.4)}62%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes ripOut{from{transform:scale(1);opacity:.85}to{transform:scale(2.4);opacity:0}}
.ring.pop{animation:discPop 320ms cubic-bezier(.34,1.56,.64,1)}
.ring .rip{position:absolute;inset:-2px;border-radius:50%;border:1.5px solid rgba(95,220,151,.9);pointer-events:none;animation:ripOut 560ms cubic-bezier(.16,1,.3,1) 120ms both}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:100;
  width:min(calc(100% - 20px),440px);height:58px;border-radius:29px;padding:5px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 55%),rgba(10,26,20,.62);
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border:1px solid var(--hair2);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(0,0,0,.35),0 12px 32px -8px rgba(0,0,0,.55)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.62);font-size:9.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;border-radius:24px}
.tab.on{background:rgba(227,200,134,.14);box-shadow:inset 0 0 0 1px rgba(227,200,134,.32);color:var(--accent)}
.tab svg{stroke:currentColor}
.scrim{position:fixed;inset:0;z-index:200;background:rgba(4,5,8,.62);opacity:0;pointer-events:none;transition:opacity 240ms linear}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:210;left:50%;transform:translate(-50%,103%);bottom:0;width:100%;max-width:480px;max-height:90svh;
  display:flex;flex-direction:column;border-radius:28px 28px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 50%,rgba(255,255,255,.015)),rgba(10,26,20,.90);
  border:1px solid var(--hair2);border-bottom:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 -24px 60px -20px rgba(0,0,0,.7);
  transition:transform 420ms var(--me-sheet)}
.sheet.open{transform:translate(-50%,0)}
.sheet.closing{transition:transform 280ms var(--me-exit)}
.sheet.settled{-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 50%,rgba(255,255,255,.015)),rgba(10,26,20,.72)}
.grab{padding:8px 0 2px;display:grid;place-items:center;min-height:24px;width:100%}
.grab i{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);display:block}
.sheet-body{overflow-y:auto;padding:4px 18px 8px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:10px;padding:12px 18px calc(12px + max(12px, env(safe-area-inset-bottom)));border-top:1px solid rgba(255,255,255,.08)}
.readout{font-family:var(--mono);font-size:40px;line-height:1;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;background:transparent;border:none;width:3.4em;padding:0}
.readout:focus{outline:none}
.readout.warned{color:var(--warn)}
.readout.blocked{color:var(--err)}
.step{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.02)),var(--plate);border:1px solid var(--hair);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20)}
.step:active{transform:scale(.94)}
.advice{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;border-radius:12px;padding:6px 8px 6px 12px;
  background:rgba(247,140,58,.10);border:1px solid rgba(247,140,58,.3)}
.advice.err{background:rgba(255,107,107,.10);border-color:rgba(255,107,107,.35)}
.advice .t{font-size:12px;font-weight:600;color:var(--warn)}
.advice.err .t{color:var(--err)}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:44px;padding:6px 14px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);border:1px solid var(--hair);color:var(--ink2);font-size:13px;font-weight:600}
.chip.sel{background:var(--accent);color:var(--on-accent);border-color:transparent}
.toast{position:fixed;z-index:300;left:50%;transform:translate(-50%,16px);opacity:0;bottom:calc(86px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:100px;max-width:calc(100% - 32px);
  background:var(--film),var(--sheen),rgba(13,32,25,.97);border:1px solid var(--hair2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 12px 32px rgba(0,0,0,.5);
  transition:transform 320ms var(--me-sheet),opacity 320ms var(--me-sheet);pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast .m{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.toast .u{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);background:rgba(227,200,134,.15);
  border:1px solid rgba(227,200,134,.3);border-radius:100px;padding:8px 12px;flex-shrink:0}
.prow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}
.prow .pm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .pn{font-family:var(--serif);font-size:18px;line-height:21px;font-weight:600}
.prow .pd{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent)}
.prow .px{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.logged .pd{color:rgba(255,255,255,.78)}
.card.logged .px{color:var(--ok);font-family:var(--mono);font-size:11px}
.iconbtn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.06);border:1px solid var(--hair);color:var(--ink3);position:relative}
.iconbtn::after{content:'';position:absolute;inset:-6px}
.iconbtn.on{color:var(--accent);border-color:rgba(227,200,134,.4)}
.stk > summary,.it > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
.stk > summary::-webkit-details-marker,.it > summary::-webkit-details-marker{display:none}
.stk > summary{padding:16px 16px 16px 18px}
.stk > summary > svg:last-child,.it > summary > svg:last-child{flex-shrink:0;transition:transform 200ms var(--me-out)}
.stk[open] > summary > svg:last-child,.it[open] > summary > svg:last-child{transform:rotate(90deg)}
.stk-body{padding:0 12px 14px;display:flex;flex-direction:column;gap:8px}
.it{border-radius:14px;background:rgba(0,0,0,.20);border:1px solid rgba(255,255,255,.07)}
.it > summary{padding:12px 14px;min-height:56px}
.it-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.ing{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:12.5px;line-height:1.35}
.ing .a{font-family:var(--mono);color:var(--accent);text-align:right}
.bench{border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.pill{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:7px;padding:3px 8px}
.pill.cyan{color:var(--accent);background:rgba(227,200,134,.14);border:1px solid rgba(227,200,134,.3)}
.pill.amber{color:var(--warn);background:rgba(247,140,58,.14);border:1px solid rgba(247,140,58,.3)}
.rangetrack{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08)}
.rangetrack .zone{position:absolute;top:0;bottom:0;border-radius:3px;background:rgba(95,220,151,.22)}
.rangetrack .pt{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px var(--plate)}
.delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;font-weight:700;border-radius:8px;padding:3px 7px}
.delta.good{color:var(--ok);background:rgba(95,220,151,.12);border:1px solid rgba(95,220,151,.3)}
.delta.warn{color:var(--warn);background:rgba(247,140,58,.12);border:1px solid rgba(247,140,58,.3)}
.fine{text-align:center;font-size:11px;color:var(--ink4)}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dtoggle{height:40px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--hair);color:var(--ink3);font-size:12px;font-weight:700}
.dtoggle.on{background:rgba(227,200,134,.16);border-color:rgba(227,200,134,.4);color:var(--accent)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade{animation:fadeIn 200ms var(--me-out)}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:1ms !important;animation-duration:1ms !important}
}
</style>

async function api(path, body) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  const opt = { signal: controller.signal, headers: { 'Authorization': 'Bearer ' + S.token } };
  if (body) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r, j = null;
  try {
    r = await fetch(API + path, opt);
    try { j = await r.json(); } catch (e) { if (controller.signal.aborted) throw e; }
  } catch (e) {
    if (controller.signal.aborted) throw new Error('Connection timed out. Check your connection and try again.');
    throw e;
  } finally { clearTimeout(timer); }
  if (r.status === 401) { S.role = null; throw Object.assign(new Error((j && j.error) || 'Bad access code'), { auth: true }); }
  if (!r.ok) throw Object.assign(new Error((j && j.error) || ('Error ' + r.status)), { status: r.status, body: j });
  return j;
}

}

/* ── trend chart: labeled y-gridlines + x dates (InBody-style) ── */
function trendSVG(pts, decimals) {
  if (!pts || pts.length < 2) return '';
  const dp = decimals == null ? 1 : decimals;
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.15, hi === lo ? 1 : 0.001);
  lo -= pad; hi += pad;
  const W = 358, H = 132, L = 10, R = 318, T = 10, B = 100;
  const X = (i) => L + (pts.length === 1 ? 0 : (i / (pts.length - 1)) * (R - L));
  const Y = (v) => B - ((v - lo) / (hi - lo)) * (B - T);
  const gridVals = [hi - pad * 0, (hi + lo) / 2, lo + pad * 0];
  const dpEff = (hi - lo) < 1 ? Math.max(dp, 2) : dp;
  const grid = [hi, (hi + lo) / 2, lo].map(v =>
    `<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${R}" y2="${Y(v).toFixed(1)}" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
     <text x="${W - 4}" y="${(Y(v) + 3.5).toFixed(1)}" fill="rgba(255,255,255,.51)" font-size="10" font-family="JetBrains Mono, ui-monospace, monospace" text-anchor="end">${v.toFixed(dpEff)}</text>`).join('');
  const line = 'M' + pts.map((p, i) => `${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' L');
  const area = line + ` L${X(pts.length - 1).toFixed(1)} ${B} L${L} ${B} Z`;
  const dots = pts.map((p, i) => i === pts.length - 1
    ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5" fill="#e3c886"/><circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="8" fill="none" stroke="rgba(227,200,134,.35)" stroke-width="2"/>`
    : `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="#e3c886" opacity=".5"/>`).join('');
  const md = (d) => { const [y, m, dd] = d.split('-'); return `${Number(m)}/${Number(dd)}/${y.slice(-2)}`; };
  const idxs = pts.length <= 4 ? pts.map((_, i) => i) : [0, Math.floor((pts.length - 1) / 3), Math.floor(2 * (pts.length - 1) / 3), pts.length - 1];
  const xl = [...new Set(idxs)].map(i =>
    `<text x="${X(i).toFixed(1)}" y="${H - 14}" fill="rgba(255,255,255,.51)" font-size="10" font-family="JetBrains Mono, ui-monospace, monospace" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${md(pts[i].d)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%" role="img" aria-label="${esc(pts.map(p => fmtD(p.d) + ': ' + p.v).join('; '))}">
    ${grid}<path d="${area}" fill="rgba(227,200,134,.10)"/>
    <path d="${line}" fill="none" stroke="#e3c886" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}

// Match both the assay and its unit so incompatible measurements never share a chart.
const markerKey = m => JSON.stringify([m.name, m.unit || '']);
function markerHistory(m) {
  return [...S.data.labs].sort((a,b) => (a.date||'').localeCompare(b.date||''))
    .flatMap(p => (p.markers || []).filter(x => markerKey(x) === markerKey(m) && hasNumber(x.value)).map(x => ({ d: p.date, v: Number(x.value) })));

function documentButton(source) {
  return source && /^doc_[a-f0-9]{20}$/.test(source.id || '') ? `<button class="document-download" data-act="download-document" data-id="${esc(source.id)}"><span>${esc(source.name)}${source.status ? `<small>${esc(source.status)}</small>` : ''}</span><span aria-hidden="true">↓</span></button>` : '';

async function downloadDocument(button) {
  if (button.disabled) return;
  button.disabled = true;
  try {
    const file = await api('/document?id=' + encodeURIComponent(button.dataset.id));
    if (!['application/pdf', 'text/csv'].includes(file.mime)) throw new Error('Unsupported document');
    const bytes = Uint8Array.from(atob(file.base64), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: file.mime }));
    const link = document.createElement('a');
    link.href = url; link.download = file.name; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast('Original file downloaded');
  } catch (err) { toast(err.message || 'Couldn’t download. Try again.'); }
  finally { button.disabled = false; }
}
function outsideReportRange(m) {
  const numeric = hasNumber(m.value), lo = hasNumber(m.lo), hi = hasNumber(m.hi);

  const flag = String(m.flag || '').trim().toUpperCase();
  return (flag !== '' && !['N','NORMAL'].includes(flag)) || (numeric && valid && ((lo && Number(m.value) < Number(m.lo)) || (hi && Number(m.value) > Number(m.hi))));
}

  } else {
    const documents = new Map();
    for (const p of chosen ? [chosen] : labs) for (const src of p.sources || []) documents.set(src.id, src);
    body = `<div class="record-controls"><label class="lbl" for="lab-date">Results to show</label><select class="well" id="lab-date"><option value="">Latest value of each marker</option>${labs.map(p => `<option value="${esc(p.date)}" ${chosen === p ? 'selected' : ''}>${fmtD(p.date)} · ${(p.markers || []).length} ${(p.markers || []).length === 1 ? 'result' : 'results'}</option>`).join('')}</select><label class="lbl" for="lab-search">Find a marker</label><input class="well" id="lab-search" type="search" placeholder="Search blood results" value="${esc(S.labQuery)}"></div>`;
    body += `<div class="filter-pills" aria-label="Filter blood results"><button data-act="lab-filter" data-filter="all" aria-pressed="${S.labFilter === 'all'}">All results · ${seen.size}</button><button data-act="lab-filter" data-filter="outside" aria-pressed="${S.labFilter === 'outside'}">Outside report range · ${[...seen.values()].filter(({m})=>outsideReportRange(m)).length}</button></div><p class="result-count" id="lab-result-count" aria-live="polite">${[...seen.values()].filter(({m})=>m.name.toLowerCase().includes(S.labQuery.toLowerCase().trim()) && (S.labFilter !== 'outside' || outsideReportRange(m))).length} of ${seen.size} results shown</p>`;
    if (documents.size) body += `<details class="card record-archive" data-open="lab-reports" ${openAttr('lab-reports')}><summary>Original reports <span>${documents.size} ${documents.size === 1 ? 'file' : 'files'}</span></summary><div>${[...documents.values()].map(documentButton).join('')}</div></details>`;
    body += [...seen.values()].map(({ m, date }) => {
      const v = Number(m.value), hasValue = hasNumber(m.value);
      const hasLo = hasNumber(m.lo), hasHi = hasNumber(m.hi);
      const lo = hasLo ? Number(m.lo) : 0, hi = hasHi ? Number(m.hi) : Math.max(v * 1.5, lo + 1);
      const hasReference = (hasLo || hasHi) && !(hasLo && hasHi && hi < lo);
      const span = (hi - lo) || 1, dispLo = lo - span * 0.3, dispSpan = span * 1.6;
      const pct = Math.max(3, Math.min(97, ((v - dispLo) / dispSpan) * 100));
      const zL = Math.max(0, Math.min(100, ((lo - dispLo) / dispSpan) * 100));
      const zR = hasHi ? Math.max(0, Math.min(100, ((hi - dispLo) / dispSpan) * 100)) : 100;
      const flagged = outsideReportRange(m);
      const col = flagged ? 'var(--warn)' : hasValue && hasReference ? 'var(--ok)' : 'var(--ink3)';
      const verdict = m.referenceType === 'provider-target' ? 'Provider targets' : flagged ? (m.flag === 'L' || (hasValue && hasLo && v < lo) ? 'Below range' : m.flag === 'H' || (hasValue && hasHi && v > hi) ? 'Above range' : 'Flagged') : !hasValue ? 'Reported result' : !hasReference ? 'No reference range' : 'In range';
      const reference = m.reference || (hasReference ? `${hasLo ? m.lo : '—'}–${hasHi ? m.hi : '—'}` : 'Not provided');
      const tr = markerHistory(m);
      return `<article class="card lab-result ${flagged ? 'lab-flagged' : ''}" data-marker="${esc(m.name.toLowerCase())}" data-outside="${flagged}" ${m.name.toLowerCase().includes(S.labQuery.toLowerCase().trim()) && (S.labFilter !== 'outside' || flagged) ? '' : 'hidden'}>
        <div class="lab-heading"><h2>${esc(m.name)}</h2><time class="mono" datetime="${esc(date)}">${fmtD(date)}</time></div>
        <div class="lab-value"><strong class="mono">${esc(m.value)}</strong><span class="mono">${esc(m.unit || '')}</span><span class="lab-verdict" style="color:${col}">${verdict}</span></div>
        ${hasValue && hasReference ? `<div class="rangetrack"><span class="zone" style="left:${zL}%;right:${100-zR}%"></span><span class="pt" style="left:calc(${pct}% - 6px);background:${col}"></span></div>` : ''}
        <div class="lab-reference">${esc(m.referenceLabel || 'Lab reference')}: ${esc(reference)}</div>
        ${m.note ? `<p class="lab-note">${esc(m.note)}</p>` : ''}
        ${tr.length >= 2 ? `<details class="lab-trend" data-open="${esc('lab-trend:'+markerKey(m))}" ${openAttr('lab-trend:'+markerKey(m))}><summary>View trend · ${tr.length} results</summary>${trendSVG(tr, tr.every(p => Number.isInteger(p.v)) ? 0 : 1)}</details>` : ''}
      </article>`;
    }).join('');
    body += `<p class="fine" id="lab-no-results" ${[...seen.values()].some(({m}) => m.name.toLowerCase().includes(S.labQuery.toLowerCase().trim()) && (S.labFilter !== 'outside' || outsideReportRange(m))) ? 'hidden' : ''}>No matching results. Try another search or choose All results.</p>`;
  }
  if (S.role === 'admin') body += `<button class="btn-primary" style="margin-top:16px" data-act="addlab">${I.plus('#04211b')} Add blood panel</button>`;
  return headerHTML('Labs', latest ? `<div class="sub" style="margin-top:4px">${labs.length} collection dates · latest ${fmtD(latest.date)}<br>Explore results by date or download an original report.</div>` : '') +
    `<div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:12px" class="fade">${body}</div>`;
}

function progressView() {
  const scans = [...S.data.scans].sort((a,b) => (a.measuredAt || a.date || '').localeCompare(b.measuredAt || b.date || ''));
  const newest = scans[scans.length - 1];
  const last = scans.find(x => x.id && x.id === S.scanId) || newest;
  const earlier = scans.slice(0, scans.indexOf(last));
  const first = earlier.find(x => x.id && x.id === S.compareId) || earlier[earlier.length - 1] || last;
  const scanLabel = x => fmtD(x.date) + (x.measuredAt ? ' · ' + esc(x.measuredAt.slice(11,16)) : '');
  let body = '';
  if (!last) {
    body = `<div class="fine" style="margin-top:40px">${S.role === 'admin' ? 'Add the first InBody scan below.' : 'InBody scans Roman uploads will appear here.'}</div>`;
  } else {
    body += `<div class="record-controls scan-controls"><label class="lbl" for="scan-date">Measurement</label><select class="well" id="scan-date">${[...scans].reverse().map(x => `<option value="${esc(x.id || '')}" ${x === last ? 'selected' : ''}>${scanLabel(x)}</option>`).join('')}</select>${earlier.length ? `<label class="lbl" for="scan-baseline">Compare with</label><select class="well" id="scan-baseline">${[...earlier].reverse().map(x=>`<option value="${esc(x.id || '')}" ${x === first ? 'selected' : ''}>${scanLabel(x)}</option>`).join('')}</select><p class="sub" id="scan-comparison">Change from ${scanLabel(first)} to ${scanLabel(last)}. Deltas describe measurements, not a health rating.</p>` : '<p class="sub">This is the first measurement. Choose a later measurement to compare with an earlier scan.</p>'}</div>`;
    const dl = (v) => {
      if (first === last || v == null || !Number.isFinite(v)) return '';
      const arrow = v <= 0 ? '<path d="M12 5v14M5 12l7 7 7-7"/>' : '<path d="M12 19V5M5 12l7-7 7 7"/>';
      return `<span class="delta neutral"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${arrow}</svg>${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(1)}</span>`;
    };
    const fmtv = (v) => hasNumber(v) ? esc(v) : '—';
    const tile = (label, v, unit, delta) => `<div class="card metric-tile" style="border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:6px">
      <span style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)">${label}</span>

    body += `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      ${tile('Weight', fmtv(last.weightLb), 'lb', dl(hasNumber(last.weightLb) && hasNumber(first?.weightLb) ? last.weightLb - first.weightLb : null, true))}
      ${tile('Muscle mass', fmtv(last.smmLb), 'lb', dl(hasNumber(last.smmLb) && hasNumber(first?.smmLb) ? last.smmLb - first.smmLb : null, false))}
      ${tile('Body fat', fmtv(last.pbfPct), '%', dl(hasNumber(last.pbfPct) && hasNumber(first?.pbfPct) ? last.pbfPct - first.pbfPct : null, true))}
    </div>`;
    const series = (key) => scans.filter(x => hasNumber(x[key])).map(x => ({ d: x.date, v: Number(x[key]) }));
    const w = series('weightLb'), sm = series('smmLb'), bf = series('pbfPct');
    body += chartCard('Weight (lb)', w.length + ' scans', trendSVG(w, 1));
    body += chartCard('Skeletal Muscle Mass (lb)', sm.length + ' scans', trendSVG(sm, 1));
    const sl = series('slmLb');
    body += chartCard('Soft Lean Mass (lb)', sl.length + ' scans', trendSVG(sl, 1));
    body += chartCard('Percent Body Fat (%)', bf.length + ' scans', trendSVG(bf, 1));
    const row = (l, v, u) => `<div style="display:flex;align-items:center;gap:10px">
      <span style="flex:1;font-size:13px;color:var(--ink2)">${l}</span>
      <span class="mono" style="font-size:15px;font-weight:700">${v != null ? v : '—'}</span>
      <span class="mono" style="font-size:11px;color:var(--ink3)">${u}</span></div>`;
    body += `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:12px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:13px;font-weight:700">This scan</span>
        <span class="mono" style="font-size:10.5px;color:var(--ink4)">${fmtD(last.date)}</span></div>
      ${row('Soft lean mass', last.slmLb, 'lb')}
      ${row('Body fat mass', last.bfmLb, 'lb')}
      ${row('Visceral fat level', last.vfl, '')}
      ${row('Total body water', last.tbwLb, 'lb')}
      ${row('Basal metabolic rate', last.bmrKcal, 'kcal')}
    </div>`;
  }
  if (last?.metrics?.length) body += `<details class="card record-archive" data-open="scan-metrics" ${openAttr('scan-metrics')} style="margin-top:12px"><summary>All measurements <span>${last.metrics.length} values</span></summary><dl class="scan-measurements">${last.metrics.map(m => `<div><dt>${esc(m.name)}</dt><dd class="mono">${esc(m.value)}</dd></div>`).join('')}</dl></details>`;
  if (last?.source) body += `<div class="card" style="padding:4px 16px;margin-top:12px">${documentButton(last.source)}</div>`;
  if (S.role === 'admin') body += `<button class="btn-primary" style="margin-top:16px" data-act="addscan">${I.plus('#04211b')} Add InBody scan</button>`;
  else body += `<div class="fine" style="margin-top:14px">Scans are uploaded by Roman from the InBody H40.</div>`;
  return headerHTML('Progress', last ? `<div class="sub" style="margin-top:4px">${scans.length} InBody measurements · latest <span class="mono" style="color:var(--ink2)">${fmtD(newest.date)}</span></div>` : '') +
    `<div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:0" class="fade">${body}</div>`;
}

/* ════════ sheet plumbing ════════ */
let sheetTimer = null;
let sheetOpener = null;
function openSheet(html, onmount) {
  const sh = $('#sheet'), sc = $('#scrim');
  clearTimeout(sheetTimer);
  if (!sh.classList.contains('open')) sheetOpener = document.activeElement;
  sh.inert = false;
  sh.removeAttribute('aria-hidden');
  sh.setAttribute('aria-label','Protocol details');
  $('#app').inert = true; $('#navigation').inert = true; $('#shellbar').inert = true;
  document.body.style.overflow = 'hidden';
  sh.classList.remove('closing');
  sh.innerHTML = `<button class="grab" data-act="closesheet" aria-label="Close"><i></i></button>` + html;
  // The compact forms use adjacent visual labels; give each field that same accessible name.
  sh.querySelectorAll('input,textarea,select').forEach(field => {
    if (field.hasAttribute('aria-label')) return;
    const label = field.previousElementSibling;
    if (label?.classList.contains('lbl')) field.setAttribute('aria-label', label.textContent.trim());
  });
  sc.classList.add('on');
  requestAnimationFrame(() => requestAnimationFrame(() => { if (!sh.inert) { sh.classList.add('open'); sh.focus(); } }));
  sheetTimer = setTimeout(() => sh.classList.add('settled'), 460);
  if (onmount) onmount(sh);
}
function closeSheet() {
  const sh = $('#sheet'), sc = $('#scrim');
  clearTimeout(sheetTimer);
  sh.inert = true;
  sh.setAttribute('aria-hidden', 'true');
  $('#app').inert = false; $('#navigation').inert = false; $('#shellbar').inert = false;
  document.body.style.overflow = '';
  if (sheetOpener && sheetOpener.isConnected) sheetOpener.focus();
  else document.querySelector('.tab.on')?.focus();
  sh.classList.add('closing'); sh.classList.remove('open', 'settled');
  sc.classList.remove('on');
  sheetTimer = setTimeout(() => { sh.innerHTML = ''; sh.classList.remove('closing'); }, 380);
}
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => {
  const sh = $('#sheet');
  if (!sh.inert) {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
    if (e.key === 'Tab') {
      const nodes = [...sh.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex="0"]')].filter(el => el.getClientRects().length);
      const first = nodes[0], last = nodes[nodes.length - 1];
      if (!first) { e.preventDefault(); sh.focus(); }
      else if (e.shiftKey && (document.activeElement === first || document.activeElement === sh)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (document.activeElement === last || document.activeElement === sh)) { e.preventDefault(); first.focus(); }
    }
  } else if (e.key === 'Enter' && e.target.id === 'tok') {
    e.preventDefault(); document.querySelector('[data-act="connect"]')?.click();
  } else if (e.target.matches('.tab') && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)) {
    e.preventDefault();
    const tabs = [...document.querySelectorAll('.tab')], i = tabs.indexOf(e.target);
    const next = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (/Left|Up/.test(e.key) ? -1 : 1) + tabs.length) % tabs.length;
    tabs[next].click(); document.querySelectorAll('.tab')[next].focus();
  }
});

/* ════════ The Draw (dose sheet) ════════ */
function openDose(c) {
  const k = dkey(S.viewDate);
  const isPrn = !((c.schedule && c.schedule.days) || []).length;
  const found = isPrn ? null : logFor(c, k);   // PRN: every log is a new entry
  if (found && S.role !== 'admin' && found.by && found.by !== S.role) {
    return toast(`Already logged by Roman ${relDay(k)} — ask him to change it.`);
  }
  const existing = found;
  const conc = concOf(c);
  const rec = Number(c.doseMcg) || 0;
  const uL = unitLabel(c);
  const recU = conc > 0 ? rec / conc : 0;
  const maxU = conc > 0 ? Math.max(30, Math.ceil((recU * 2.2) / 10) * 10) : 0;
  let units = conc > 0 ? (existing ? (existing.doseMcg / conc) : recU) : 0;
  let mcg = existing ? existing.doseMcg : rec;
  let invalidDoseInput = false;
  const futureDay = k > todayKey();
  const showMg = c.unit !== 'IU' && mcg >= 1000; // single source for display unit AND parse scale

  const draw = conc > 0;
  const html = `
  <div class="sheet-body">
    <div>
      <div style="font-size:22px;line-height:27px;font-weight:700;letter-spacing:-.015em">${esc(c.name)}</div>
      <div style="font-size:13px;color:var(--ink3);margin-top:3px">${esc(c.timing || 'Daily')} · Roman recommends <span class="mono" style="color:var(--ink2)">${fmtAmt(rec, c.unit)}</span></div>
    </div>
    <div class="card" style="border-radius:16px;padding:14px 14px 12px">
      <div class="lbl" style="margin:0 0 6px">${draw ? 'The Draw' : 'Dose'}</div>
      <div style="display:flex;align-items:baseline;gap:6px">
        <input class="readout" id="dv" inputmode="decimal" value="${draw ? units.toFixed(1) : (c.unit === 'IU' ? mcg : (showMg ? (mcg/1000) : mcg))}" aria-label="Dose">
        <span style="font-size:16px;color:var(--ink3)">${draw ? 'units' : (c.unit === 'IU' ? 'IU' : (showMg ? 'mg' : 'mcg'))}</span>
        <span class="mono" id="conv" style="margin-left:auto;font-size:13px;color:var(--ink2)"></span>
      </div>
      ${draw ? `
      <div style="display:flex;align-items:center;gap:8px;margin-top:12px">
        <button class="step" id="dec" aria-label="Decrease one unit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.82)" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <svg id="barrel" viewBox="0 0 266 64" style="flex:1;min-width:0;display:block;touch-action:none;cursor:grab;overflow:visible">
          <rect x="8" y="10" width="250" height="26" rx="4" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.35)" stroke-width="1.3"/>
          <rect id="liq" x="9.5" y="11.5" width="0" height="23" fill="rgba(227,200,134,.42)"/>
          <rect id="men" x="9" y="11.5" width="2" height="23" fill="#e3c886"/>
          <rect id="plg" x="7" y="6" width="6" height="34" rx="2" fill="#e3c886"/>
          <g id="ticks"></g><g id="tlbl"></g>
        </svg>
        <button class="step" id="inc" aria-label="Increase one unit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e3c886" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="mono" style="font-size:11px;color:var(--ink3);margin-top:8px">${reconLine(c)} · 10 units = 0.1 mL · snaps &frac12; unit · drag the plunger</div>` : ''}
      ${(c.ingredients || []).length ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)">
        <div style="font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px">In this shot</div>
        <div id="shotmix" style="display:flex;flex-direction:column;gap:7px"></div></div>` : ''}
      <div id="guard"></div>
    </div>
    <div>
      <span class="lbl">Time</span>
      <div class="chiprow" id="times"></div>
    </div>
  </div>
  <div class="sheet-foot">
    ${existing ? `<button class="btn-ghost" id="undo" style="color:var(--err)">Remove</button>` : `<button class="btn-ghost" id="cancel">Cancel</button>`}
    <button class="btn-primary" id="go" style="flex:1;height:52px"></button>
  </div>`;

  openSheet(html, (sh) => {
    const dv = $('#dv', sh), conv = $('#conv', sh), guard = $('#guard', sh), go = $('#go', sh);
    const isTodayView = k === todayKey();
    let when = existing ? existing.datetime : (isTodayView ? nowLocal() : k + 'T08:00');
    const times = $('#times', sh);
    const timeChips = (isTodayView ? [['Now', nowLocal()]] : []).concat([['Morning', k + 'T08:00'], ['Evening', k + 'T19:00'], ['Bedtime', k + 'T22:00']]);
    const renderTimes = () => { times.innerHTML = timeChips.map(([l, v]) =>
      `<button class="chip ${when === v ? 'sel' : ''}" data-t="${v}">${l}${when === v ? `<span class="mono" style="font-size:10px">${new Date(v).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span>` : ''}</button>`).join('');
      times.querySelectorAll('.chip').forEach(b => b.onclick = () => { when = b.dataset.t; renderTimes(); });
    };
    renderTimes();

    const X0 = 8, W = 250;
    const buildTicks = () => {
      if (!draw) return;
      let t = '', l = '';
      const step = maxU <= 30 ? 1 : maxU <= 60 ? 2 : 5;
      for (let u = 0; u <= maxU; u += step) {
        const x = X0 + (u / maxU) * W, major = u % (step * 5) === 0;
        t += `<line x1="${x}" y1="40" x2="${x}" y2="${major ? 48 : 44}" stroke="rgba(255,255,255,${major ? '.45' : '.30'})" stroke-width="1"/>`;
        if (major) l += `<text x="${x}" y="60" fill="rgba(255,255,255,.51)" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" text-anchor="middle">${u}</text>`;
      }
      $('#ticks', sh).innerHTML = t; $('#tlbl', sh).innerHTML = l;
    };
    buildTicks();

    const upd = (fromInput) => {
      if (draw) {
        units = Math.max(0, Math.min(maxU, units));
        mcg = Number((units * conc).toFixed(6));
        if (!fromInput) dv.value = units.toFixed(1);
        conv.textContent = `${fmtAmt(mcg, c.unit)} · ${mlOf(units)}`;
        const fill = Math.max(0, Math.min(W - 3, (units / maxU) * (W - 3)));
        $('#liq', sh).setAttribute('width', fill);
        $('#men', sh).setAttribute('x', 9.5 + fill - 1);
        $('#plg', sh).setAttribute('x', Math.min(252, 9.5 + fill - 2));
      } else {
        conv.textContent = fmtAmt(mcg, c.unit);
        if (!fromInput) dv.value = c.unit === 'IU' ? mcg : (showMg ? mcg / 1000 : mcg);
      }
      const mix = $('#shotmix', sh);
      if (mix && (c.ingredients || []).length) {
        const total = c.ingredients.reduce((a, i) => a + (Number(i.mg) || 0), 0) || 1;
        mix.innerHTML = c.ingredients.map(i => {
          const frac = (Number(i.mg) || 0) / total;
          return `<div style="display:flex;align-items:center;gap:8px">
            <span style="flex:1;font-size:12px;color:var(--ink2)">${esc(i.name)} <span style="color:var(--ink4)">· ${Math.round(frac*100)}%</span></span>
            <span class="mono" style="font-size:13px;font-weight:700;color:var(--accent)">${fmtMcg(mcg * frac)}</span></div>`;
        }).join('');
      }
      const ratio = rec > 0 ? mcg / rec : 1;
      const blocked = rec > 0 && ratio >= 5;
      const off = !blocked && rec > 0 && Math.abs(mcg - rec) / rec > 0.25;
      dv.classList.toggle('warned', off); dv.classList.toggle('blocked', blocked);
      const men = $('#men', sh), plg = $('#plg', sh);
      if (men) { const col = blocked ? '#ff6b6b' : off ? '#f78c3a' : '#e3c886'; men.setAttribute('fill', col); plg.setAttribute('fill', col); }
      guard.innerHTML = blocked
        ? `<div class="advice err"><span class="t">Blocked at <span class="mono">${ratio.toFixed(1)}×</span> Your protocol dose — talk to Roman</span>
           <button class="btn-ghost" id="rst" style="height:44px;font-size:12px;font-family:var(--mono)">Reset</button></div>`
        : off
        ? `<div class="advice"><span class="t"><span class="mono">${ratio.toFixed(1)}×</span> Roman's recommended dose</span>
           <button class="btn-ghost" id="rst" style="height:44px;font-size:12px;font-family:var(--mono)">Reset to ${draw ? (Math.round(recU * 2) / 2) + ' units' : fmtAmt(rec, c.unit)}</button></div>`
        : '';
      const r = $('#rst', sh); if (r) r.onclick = () => { units = recU; mcg = rec; upd(); };
      go.disabled = blocked || invalidDoseInput || !Number.isFinite(mcg) || !(mcg > 0) || futureDay;
      if (invalidDoseInput) guard.innerHTML = '<div class="advice err" role="alert"><span class="t">Enter a valid dose above zero.</span></div>';
      if (futureDay) guard.innerHTML = '<div class="advice"><span class="t">You’re viewing a future day. Log a dose after taking it.</span></div>';
      const goLabel = blocked ? 'Blocked by the dose gate'
        : `${existing ? 'Save' : 'Log'} <span class="mono" style="margin-left:6px">${draw ? (Math.round(units * 10) / 10) + ' units · ' : ''}${fmtAmt(mcg, c.unit)}</span>`;
      // Replacing the tapped button's children during input blur can swallow the first click.
      if (go.innerHTML !== goLabel) go.innerHTML = goLabel;
      if (invalidDoseInput) { go.textContent = 'Enter a valid dose'; conv.textContent = '—'; }
      if (futureDay) go.textContent = 'Scheduled for ' + fmtD(k);
    };

    if (draw) {
      $('#inc', sh).onclick = () => { invalidDoseInput = false; units = Math.round((units + 1) * 2) / 2; upd(); };
      $('#dec', sh).onclick = () => { invalidDoseInput = false; units = Math.round((units - 1) * 2) / 2; upd(); };
      const barrel = $('#barrel', sh);
      let dragging = false;
      const toUnits = (e) => { const r = barrel.getBoundingClientRect();
        return ((((e.clientX - r.left) / r.width) * 266) - X0) / W * maxU; };
      barrel.addEventListener('pointerdown', (e) => { invalidDoseInput = false; dragging = true; barrel.setPointerCapture(e.pointerId); units = toUnits(e); upd(); });
      barrel.addEventListener('pointermove', (e) => { if (dragging) { units = toUnits(e); upd(); } });
      barrel.addEventListener('pointerup', () => { dragging = false; units = Math.round(units * 2) / 2; upd(); });
      dv.addEventListener('input', () => { const v = Number(dv.value); invalidDoseInput = !dv.value.trim() || !Number.isFinite(v) || v <= 0; if (!invalidDoseInput) units = v; upd(true); });
      // Keep exact planned units and typed decimals; only dragging snaps to half-units.
      dv.addEventListener('blur', () => { if (!invalidDoseInput) upd(); });
    } else {
      dv.addEventListener('input', () => { const v = Number(dv.value); invalidDoseInput = !dv.value.trim() || !Number.isFinite(v) || v <= 0; if (!invalidDoseInput) mcg = c.unit === 'IU' ? v : (showMg ? v * 1000 : v); upd(true); });
    }
    upd();

    const cancel = $('#cancel', sh); if (cancel) cancel.onclick = closeSheet;
    const undo = $('#undo', sh); if (undo) undo.onclick = async () => {
      try { await api('/log', { deleteId: existing.id }); closeSheet(); await pull(true); toast('Removed'); }
      catch (e) { toast(e.message); }
    };
    go.onclick = async () => {
      if (go.disabled || invalidDoseInput || futureDay || !Number.isFinite(mcg) || mcg <= 0) return;
      go.disabled = true;
      // re-resolve against FRESH state: a background pull may have brought a same-day log in
      const live = isPrn ? null : logFor(c, k);
      if (live && S.role !== 'admin' && live.by && live.by !== S.role) {
        go.disabled = false; closeSheet();
        return toast(`Already logged by Roman ${relDay(k)} — ask him to change it.`);
      }
      const entry = { id: existing ? existing.id : (live ? live.id : uid()), compoundId: c.id, datetime: when, doseMcg: Number(mcg.toFixed(6)), units: draw ? Math.round(units * 10) / 10 : null };
      try {
        await api('/log', { log: entry });
        // instant confirmation: update locally + pop the check, then reconcile in background
        S.data.logs = [{ ...entry, by: S.role }, ...S.data.logs.filter(l => l.id !== entry.id)];
        flashId = c.id; setTimeout(() => { flashId = null; }, 1600);
        closeSheet(); render();
        // reconcile + self-heal: KV writes from two devices in the same instant can drop one —
        // if ours vanished from the pulled state, post it once more.
        pull(true).then(async () => {
          if (!S.data.logs.some(l => l.id === entry.id)) {
            try { await api('/log', { log: entry }); await pull(true); } catch (e) {}
          }
        });
        toast(`✓ ${c.name} · ${fmtAmt(entry.doseMcg, c.unit)}`, async () => {
          try { await api('/log', { deleteId: entry.id }); await pull(true); } catch (e) { toast(e.message); }
        });
      } catch (e) { go.disabled = false; toast(e.message); }
    };
  });
}

/* ════════ admin forms ════════ */
function compForm(c) {
  const isNew = !c;
  c = c || { id: 'c_' + uid(), name: '', category: '', purpose: '', benefits: [], doseMcg: '', mcgPerUnit: '', timing: 'Morning', schedule: { days: [0,1,2,3,4,5,6] }, active: true };
  const days = (c.schedule && c.schedule.days) || [0,1,2,3,4,5,6];
  const html = `
  <div class="sheet-body">
    <div style="font-size:22px;font-weight:700">${isNew ? 'Add compound' : 'Edit ' + esc(c.name)}</div>
    <div><span class="lbl">Name</span>
      <input class="well" id="f-name" list="libnames" value="${esc(c.name)}" placeholder="Start typing — common ones autofill">
      <datalist id="libnames">${Object.keys(LIB).map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><span class="lbl">Category</span><input class="well" id="f-cat" value="${esc(c.category)}"></div>
      <div><span class="lbl">Timing</span><select class="well" id="f-time">
        ${['Morning','Evening','Nightly','As needed'].map(t => `<option ${c.timing === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><span class="lbl">Dose (<span id="f-ul">${c.unit === 'IU' ? 'IU' : 'mcg'}</span>)</span><input class="well mono" id="f-dose" inputmode="numeric" value="${esc(c.doseMcg)}"></div>
      <div><span class="lbl">Unit</span><select class="well" id="f-unit"><option ${c.unit !== 'IU' ? 'selected' : ''}>mcg</option><option ${c.unit === 'IU' ? 'selected' : ''}>IU</option></select></div>
    </div>
    <div><span class="lbl">Vial contents &amp; volume</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <input class="well mono" id="f-vial" inputmode="decimal" value="${esc(c.vialAmount || '')}" placeholder="Vial (${c.unit === 'IU' ? 'IU' : 'mg'})" aria-label="Vial amount">
        <input class="well mono" id="f-bac" inputmode="decimal" value="${esc(c.bacMl || '')}" placeholder="BAC water (mL)" aria-label="Solution or diluent volume in milliliters">
      </div>
      <div class="fine" id="f-calc" style="text-align:left;margin-top:6px"></div></div>
    <div><span class="lbl">Per-unit strength (auto from vial · manual if empty)</span><input class="well mono" id="f-conc" inputmode="decimal" value="${esc(c.mcgPerUnit)}" placeholder="0 = no syringe"></div>
    <div><span class="lbl">Blend ingredients — one per line as "Name: mg" (optional)</span>
      <textarea class="well mono" id="f-ing" rows="3" placeholder="GHK-Cu: 50">${esc((c.ingredients || []).map(i => i.name + ': ' + i.mg).join('\n'))}</textarea></div>
    <div><span class="lbl">Days</span><div class="days7" id="f-days">
      ${'SMTWTFS'.split('').map((d, i) => `<button class="dtoggle ${days.includes(i) ? 'on' : ''}" data-d="${i}" aria-label="${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][i]}" aria-pressed="${days.includes(i)}">${d}</button>`).join('')}</div>
      <div class="fine" style="text-align:left;margin-top:6px">No days selected = as-needed only.</div></div>
    <div><span class="lbl">What it does (shown in Library)</span><textarea class="well" id="f-purp" rows="3">${esc(c.purpose)}</textarea></div>
    <div><span class="lbl">Benefits — one per line</span><textarea class="well" id="f-ben" rows="3">${esc((c.benefits || []).join('\n'))}</textarea></div>
  </div>
  <div class="sheet-foot">
    ${isNew ? `<button class="btn-ghost" id="f-cancel">Cancel</button>` : `<button class="btn-ghost" id="f-deact" style="color:var(--warn)">${c.active === false ? 'Reactivate' : 'Deactivate'}</button>`}
    <button class="btn-primary" id="f-save" style="flex:1">Save</button>
  </div>`;
  openSheet(html, (sh) => {
    const nameEl = $('#f-name', sh);
    nameEl.addEventListener('change', () => {
      const lib = LIB[nameEl.value.trim()];
      if (lib && isNew) {
        $('#f-cat', sh).value = lib.category; $('#f-time', sh).value = lib.timing;
        $('#f-dose', sh).value = lib.doseMcg; $('#f-conc', sh).value = lib.mcgPerUnit;
        $('#f-purp', sh).value = lib.purpose; $('#f-ben', sh).value = lib.benefits.join('\n');
      }
    });
    sh.querySelectorAll('.dtoggle').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', String(b.classList.toggle('on'))));
    const calc = () => {
      const unit = $('#f-unit', sh).value;
      $('#f-ul', sh).textContent = unit;
      $('#f-vial', sh).placeholder = 'Vial (' + (unit === 'IU' ? 'IU' : 'mg') + ')';
      const v = parseFloat($('#f-vial', sh).value), b = parseFloat($('#f-bac', sh).value);
      if (v > 0 && b > 0) {
        const per = unit === 'IU' ? v / (b * 100) : (v * 1000) / (b * 100);
        $('#f-conc', sh).value = Math.round(per * 100) / 100;
        $('#f-calc', sh).textContent = `= ${Math.round(per * 100) / 100} ${unit} per syringe unit (${b} mL = ${b * 100} units)`;
      } else $('#f-calc', sh).textContent = 'Premixed oils: total vial amount and fill volume. Powders: vial amount and added diluent. Leave blank to log by dose only.';
    };
    ['f-unit','f-vial','f-bac'].forEach(id => $('#' + id, sh).addEventListener('input', calc));
    $('#f-unit', sh).addEventListener('change', calc);
    calc();
    const fc = $('#f-cancel', sh); if (fc) fc.onclick = closeSheet;
    const fd = $('#f-deact', sh); if (fd) fd.onclick = async () => {
      const next = S.data.compounds.map(x => x.id === c.id ? { ...x, active: x.active === false } : x);
      if (await adminWrite({ compounds: next }, c.active === false ? 'Reactivated' : 'Deactivated')) closeSheet();
    };
    $('#f-save', sh).onclick = async () => {
      const btn = $('#f-save', sh); if (btn.disabled) return; btn.disabled = true;
      const done = (ok) => { if (!ok) btn.disabled = false; };
      const name = nameEl.value.trim();
      const dose = parseFloat($('#f-dose', sh).value);
      if (!name) { done(false); return toast('Name it first'); }
      if (!Number.isFinite(dose) || dose <= 0) { done(false); return toast('Set a dose first'); }
      const upd = {
        ...c, name, category: $('#f-cat', sh).value.trim(), timing: $('#f-time', sh).value,
        unit: $('#f-unit', sh).value === 'IU' ? 'IU' : 'mcg',
        vialAmount: parseFloat($('#f-vial', sh).value) || 0,
        bacMl: parseFloat($('#f-bac', sh).value) || 0,
        ingredients: $('#f-ing', sh).value.split('\n').map(l => { const m = l.split(':'); const nm = (m[0]||'').trim(); const mg = parseFloat(m[1]); return nm && Number.isFinite(mg) ? { name: nm, mg } : null; }).filter(Boolean),
        doseMcg: Number(dose.toFixed(6)), mcgPerUnit: parseFloat($('#f-conc', sh).value) || 0,
        purpose: $('#f-purp', sh).value.trim(),
        benefits: $('#f-ben', sh).value.split('\n').map(s => s.trim()).filter(Boolean),
        schedule: { days: [...sh.querySelectorAll('.dtoggle.on')].map(b => Number(b.dataset.d)).sort() },
      };
      const next = isNew ? [...S.data.compounds, upd] : S.data.compounds.map(x => x.id === c.id ? upd : x);
      const ok = await adminWrite({ compounds: next }, isNew ? `Added ${name}` : 'Saved');
      done(ok); if (ok) closeSheet();
    };
  });
}

      <div><span class="lbl">Brand</span><input class="well" id="k-brand" value="${esc(c.brand || '')}"></div>
      <div><span class="lbl">Type</span><select class="well" id="k-kind">
        ${[['supp', 'Supplement'], ['med', 'Prescription'], ['research', 'Research']].map(([v, l]) => `<option value="${v}" ${c.kind === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><span class="lbl">Take</span><input class="well" id="k-serv" value="${esc(c.serving || '')}" placeholder="2 capsules"></div>
      <div><span class="lbl">Stack</span><select class="well" id="k-stack">
        ${(S.data.stacks || []).map(st => `<option value="${st.id}" ${c.stack === st.id ? 'selected' : ''}>${esc(st.name)}</option>`).join('')}</select></div>
    </div>
    <div><span class="lbl">In each serving — one per line as "Name: amount"</span>
      <textarea class="well mono" id="k-ing" rows="4" placeholder="Vitamin D3: 25 mcg">${esc((c.ingredients || []).map(i => i.name + ': ' + i.amount).join('\n'))}</textarea></div>
    <div><span class="lbl">What it's for</span><textarea class="well" id="k-purp" rows="3">${esc(c.purpose || '')}</textarea></div>
    <div><span class="lbl">Benefits — one per line</span><textarea class="well" id="k-ben" rows="3">${lines(c.benefits)}</textarea></div>
    <div><span class="lbl">Note (how to take, cautions)</span><input class="well" id="k-note" value="${esc(c.note || '')}"></div>
  </div>
  <div class="sheet-foot">
    ${isNew ? `<button class="btn-ghost" id="k-cancel">Cancel</button>` : `<button class="btn-ghost" id="k-del" style="color:var(--err)">Remove</button>`}
    <button class="btn-primary" id="k-save" style="flex:1">Save</button>
  </div>`, (sh) => {
    const v = (id) => $('#' + id, sh).value.trim();
    const kc = $('#k-cancel', sh); if (kc) kc.onclick = closeSheet;
    const kd = $('#k-del', sh); if (kd) kd.onclick = async () => {
      if (await adminWrite({ compounds: S.data.compounds.filter(x => x.id !== c.id) }, `Removed ${c.name}`)) closeSheet();
    };
    $('#k-save', sh).onclick = async () => {
      const btn = $('#k-save', sh); if (btn.disabled) return;
      if (!v('k-name')) return toast('Name it first');
      btn.disabled = true;
      const upd = { ...c, name: v('k-name'), brand: v('k-brand'), kind: v('k-kind'), serving: v('k-serv'), stack: v('k-stack'),
        ingredients: v('k-ing').split('\n').map(l => { const i = l.indexOf(':'); return i > 0 ? { name: l.slice(0, i).trim(), amount: l.slice(i + 1).trim() } : null; }).filter(Boolean),
        purpose: v('k-purp'), benefits: v('k-ben').split('\n').map(b => b.trim()).filter(Boolean), note: v('k-note') };
      const next = isNew ? [...S.data.compounds, upd] : S.data.compounds.map(x => x.id === c.id ? upd : x);
      if (await adminWrite({ compounds: next }, isNew ? `Added ${upd.name}` : 'Saved')) closeSheet(); else btn.disabled = false;
    };
  });
}

// One-time import link, #import=<base64url gzip JSON {items}>: how Roman loads Trey's stacks without the list
// ever sitting in this public repo. A URL fragment is never sent to a server.
async function maybeImport() {
  const m = /^#import=([A-Za-z0-9_-]+)$/.exec(location.hash);
  if (!m || !S.loaded) return;
  history.replaceState(null, '', location.pathname + location.search);
  if (S.role !== 'admin') return toast('Open the import link signed in with the admin code');
  let items = null;
  try { items = (await new Response(new Blob([b64uBytes(m[1])]).stream().pipeThrough(new DecompressionStream('gzip'))).json()).items; } catch {}
  const ids = new Set((S.data.stacks || []).map(st => st.id));
  if (!Array.isArray(items) || !items.length || items.some(x => !x || !x.id || !x.name || !ids.has(x.stack))) return toast('That import link is damaged');
  const load = () => adminWrite({ compounds: [...S.data.compounds.filter(c => !c.stack), ...items] }, 'Stacks loaded');
  // empty stacks load straight away; replacing stacks that already have items asks first
  if (!S.data.compounds.some(c => c.stack)) { if (await load()) { S.tab = 'supps'; render(); } return; }
  const am = items.filter(x => x.stack === 'am').length;
  openSheet(`<div class="sheet-body"><div style="font-size:22px;font-weight:700">Load supplement stacks</div>
    <div style="font-size:14px;line-height:1.5;color:var(--ink2)">${am} morning and ${items.length - am} night items. This replaces everything in the stacks now; injections and meds are not touched.</div></div>
    <div class="sheet-foot"><button class="btn-ghost" id="i-no">Cancel</button><button class="btn-primary" id="i-yes" style="flex:1">Load ${items.length} items</button></div>`, (sh) => {
    $('#i-no', sh).onclick = closeSheet;
    $('#i-yes', sh).onclick = async () => {
      $('#i-yes', sh).disabled = true;
      if (await load()) { closeSheet(); S.tab = 'supps'; render(); }
      else $('#i-yes', sh).disabled = false;
    };
  });
}
window.addEventListener('hashchange', maybeImport);

/* ════════ reminders: Web Push from the worker's cron, like Protocol OS ════════ */
const PUSH_KEY = 'trey_push';
const pushPrefs = () => { try { return JSON.parse(localStorage.getItem(PUSH_KEY)); } catch { return null; } };
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // tapping a reminder while the app is open: jump to the tab it is about
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'open-tab') return;
    closeSheet(); S.tab = e.data.tab || 'protocol'; S.viewDate = new Date(); S.pinnedDate = false; render(); pull(true);
  });
}
async function pushState() {
  if (isIOS && !standalone()) return 'install';
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  try { const reg = await navigator.serviceWorker.getRegistration(); return reg && await reg.pushManager.getSubscription() ? 'on' : 'off'; } catch { return 'off'; }
}
const b64uBytes = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), ch => ch.charCodeAt(0));
async function pushOn(prefs) {
  // permission first, while the tap still counts as a user gesture (iOS insists)
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Notifications are blocked — allow them in Settings' : 'Notifications were not allowed');
  const { publicKey } = await api('/push/config');
  const reg = await Promise.race([navigator.serviceWorker.ready,
    new Promise((_, no) => setTimeout(() => no(new Error('The app’s service worker is not running — reload and try again')), 8000))]);
  const key = b64uBytes(publicKey);
  let sub = await reg.pushManager.getSubscription();
  const cur = sub && sub.options && sub.options.applicationServerKey;
  if (cur && new Uint8Array(cur).join() !== key.join()) { await sub.unsubscribe(); sub = null; } // the worker's key changed
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
  await api('/push/subscribe', { subscription: sub.toJSON(), ...prefs, tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
  localStorage.setItem(PUSH_KEY, JSON.stringify(prefs));
}
async function pushSub() { const reg = await navigator.serviceWorker.getRegistration(); return reg && reg.pushManager.getSubscription(); }

async function openReminders() {
  const st = await pushState();
  const p = pushPrefs() || { times: { am: '', pm: '' }, nudge: 0 };
  const msg = {
    install: 'Reminders work from the Home Screen app. In Safari tap <b>Share → Add to Home Screen</b>, open <b>Trey</b> from the new icon, then tap the bell again.',
    unsupported: 'This browser can’t show notifications. Open the app in Safari on iPhone, or Chrome.',
    denied: 'Notifications are blocked for this app. Allow them in <b>Settings → Notifications → Trey</b>, then come back.',
    on: 'Reminders are on for this device.',
    off: 'Choose optional reminders for your scheduled doses. Empty supplement stacks do not send reminders.',
  }[st];
  const can = st === 'on' || st === 'off';
  openSheet(`
  <div class="sheet-body">
    <div style="font-size:22px;font-weight:700">Reminders</div>
    <div style="font-size:14px;line-height:1.5;color:var(--ink2)">${msg}</div>
    ${can ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><span class="lbl">Morning</span><input class="well mono" type="time" id="r-am" value="${esc(p.times.am)}"></div>
      <div><span class="lbl">Evening</span><input class="well mono" type="time" id="r-pm" value="${esc(p.times.pm)}"></div></div>
    <div class="fine" style="text-align:left">Morning and Evening cover injections and meds: a reminder lists only what is still unlogged, and you can clear a time to skip it.${(S.data.stacks || []).length ? ` Once populated, supplement stacks remind once a day: ${S.data.stacks.map(x => x.name.toLowerCase() + ' at ' + clockOf(x.time)).join(', ')}.` : ''}</div>
    <div><span class="lbl">Still not logged? Remind again after</span><div class="chiprow" id="r-nudge">
      ${[[0,'Off'],[30,'30 min'],[60,'1 hour']].map(([v, l]) => `<button class="chip ${p.nudge === v ? 'sel' : ''}" data-v="${v}">${l}</button>`).join('')}</div></div>` : ''}
  </div>
  ${can ? `<div class="sheet-foot">
    ${st === 'on' ? `<button class="btn-ghost" id="r-off" style="color:var(--warn)">Turn off</button><button class="btn-ghost" id="r-test">Test</button>` : ''}
    <button class="btn-primary" id="r-save" style="flex:1">${st === 'on' ? 'Save' : 'Turn on'}</button></div>` : ''}`, (sh) => {
    sh.setAttribute('aria-label','Reminders');
    if (!can) return;
    let nudge = p.nudge;
    const chips = sh.querySelectorAll('#r-nudge .chip');
    chips.forEach(b => b.onclick = () => { nudge = Number(b.dataset.v); chips.forEach(x => x.classList.toggle('sel', x === b)); });
    const busy = async (btn, fn) => { if (btn.disabled) return; btn.disabled = true; try { await fn(); } catch (e) { toast(e.message || String(e)); } btn.disabled = false; };
    $('#r-save', sh).onclick = (e) => busy(e.currentTarget, async () => {
      const times = { am: $('#r-am', sh).value, pm: $('#r-pm', sh).value };
      await pushOn({ times, nudge });
      closeSheet(); render(); toast(st === 'on' ? 'Reminder times saved' : 'Reminders on');
    });
    const off = $('#r-off', sh); if (off) off.onclick = (e) => busy(e.currentTarget, async () => {
      const sub = await pushSub();
      if (sub) { await api('/push/unsubscribe', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
      localStorage.removeItem(PUSH_KEY);
      closeSheet(); render(); toast('Reminders off');
    });
    const test = $('#r-test', sh); if (test) test.onclick = (e) => busy(e.currentTarget, async () => {
      const sub = await pushSub();
      if (!sub) throw new Error('Reminders are off on this device');
      await api('/push/test', { endpoint: sub.endpoint });
      toast('Test sent — it should arrive in a few seconds');
    });
  });
}

function labForm() {
  const rowHTML = () => `<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:6px" class="mrow">
    <input class="well" aria-label="Marker name" placeholder="Marker" style="padding:10px 10px">
    <input class="well mono" aria-label="Result" placeholder="Value" inputmode="decimal" style="padding:10px 8px">
    <input class="well" aria-label="Unit" placeholder="Unit" style="padding:10px 8px">
    <input class="well mono" aria-label="Reference low" placeholder="Low" inputmode="decimal" style="padding:10px 8px">
    <input class="well mono" aria-label="Reference high" placeholder="High" inputmode="decimal" style="padding:10px 8px">
  </div>`;
  const html = `
  <div class="sheet-body">
    <div style="font-size:22px;font-weight:700">Add blood panel</div>
    <div><label class="lbl" for="l-date">Panel date</label><input class="well mono" id="l-date" type="date" value="${todayKey()}"></div>
    <div><span class="lbl">Markers</span><div id="l-rows" style="display:flex;flex-direction:column;gap:8px">${rowHTML()}${rowHTML()}${rowHTML()}</div>
      <button class="btn-ghost" id="l-more" style="margin-top:8px;height:44px">+ Another marker</button></div>
  </div>
  <div class="sheet-foot"><button class="btn-ghost" id="l-cancel">Cancel</button>
    <button class="btn-primary" id="l-save" style="flex:1">Save panel</button></div>`;
  openSheet(html, (sh) => {
    $('#l-more', sh).onclick = () => $('#l-rows', sh).insertAdjacentHTML('beforeend', rowHTML());
    $('#l-cancel', sh).onclick = closeSheet;
    $('#l-save', sh).onclick = async () => {
      const btn = $('#l-save', sh); if (btn.disabled) return; btn.disabled = true;
      const reject = (message, field) => { btn.disabled = false; field?.focus(); toast(message); };
      const dateField = $('#l-date', sh), date = dateField.value;
      const parsedDate = /^\d{4}-\d{2}-\d{2}$/.test(date) ? new Date(date + 'T00:00:00Z') : null;
      if (!parsedDate || !Number.isFinite(parsedDate.getTime()) || parsedDate.toISOString().slice(0, 10) !== date) return reject('Choose a valid panel date', dateField);
      const numeric = value => /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(value) && Number.isFinite(Number(value));
      const markers = [];
      for (const row of sh.querySelectorAll('.mrow')) {
        const fields = [...row.querySelectorAll('input')];
        const [n, v, u, lo, hi] = fields.map(i => i.value.trim());
        if (![n, v, u, lo, hi].some(Boolean)) continue;
        if (!n || !v) return reject('Each marker needs a name and result', fields[!n ? 0 : 1]);
        if ((lo && !numeric(lo)) || (hi && !numeric(hi))) return reject('Reference limits must be numbers or left blank', fields[lo && !numeric(lo) ? 3 : 4]);
        if (lo && hi && Number(lo) > Number(hi)) return reject('The low reference limit must not exceed the high limit', fields[3]);
        markers.push({ name: n, value: numeric(v) ? Number(v) : v, unit: u, lo: lo ? Number(lo) : null, hi: hi ? Number(hi) : null });
      }
      if (!markers.length) { btn.disabled = false; return toast('Add at least one marker'); }
      const next = [...S.data.labs, { id: 'lab_' + uid(), date, markers }];
      const ok = await adminWrite({ labs: next }, 'Panel added');
      if (!ok) btn.disabled = false; else closeSheet();
    };
  });
}

function scanForm() {
  const F = [['weightLb','Weight (lb)'],['smmLb','Skeletal muscle mass (lb)'],['slmLb','Soft lean mass (lb)'],['pbfPct','Body fat (%)'],['bfmLb','Body fat mass (lb)'],['vfl','Visceral fat level'],['tbwLb','Total body water (lb)'],['bmrKcal','BMR (kcal)']];
  const html = `
  <div class="sheet-body">
    <div style="font-size:22px;font-weight:700">Add InBody scan</div>
    <div><span class="lbl">Scan date</span><input class="well mono" id="s-date" type="date" value="${todayKey()}"></div>
    ${F.map(([k, l]) => `<div><span class="lbl">${l}</span><input class="well mono" id="s-${k}" inputmode="decimal"></div>`).join('')}
  </div>
  <div class="sheet-foot"><button class="btn-ghost" id="s-cancel">Cancel</button>
    <button class="btn-primary" id="s-save" style="flex:1">Save scan</button></div>`;
  openSheet(html, (sh) => {
    $('#s-cancel', sh).onclick = closeSheet;
    $('#s-save', sh).onclick = async () => {
      const btn = $('#s-save', sh); if (btn.disabled) return; btn.disabled = true;
      const reject = (message, field) => { btn.disabled = false; field?.focus(); toast(message); };
      const dateField = $('#s-date', sh), date = dateField.value;
      const parsedDate = /^\d{4}-\d{2}-\d{2}$/.test(date) ? new Date(date + 'T00:00:00Z') : null;
      if (!parsedDate || !Number.isFinite(parsedDate.getTime()) || parsedDate.toISOString().slice(0, 10) !== date) return reject('Choose a valid scan date', dateField);
      const scan = { id: 'scan_' + uid(), date };
      let any = false;
      for (const [k, label] of F) {
        const field = $('#s-' + k, sh), raw = field.value.trim();
        if (!raw) continue;
        const value = Number(raw);
        if (!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw) || !Number.isFinite(value)) return reject(`${label} must be a valid nonnegative number`, field);
        if (k === 'weightLb' && value === 0) return reject('Weight must be greater than zero', field);
        if (k === 'pbfPct' && value > 100) return reject('Body fat must be between 0 and 100%', field);
        scan[k] = value; any = true;
      }
      if (!any) { btn.disabled = false; return toast('Enter the scan numbers'); }
      const next = [...S.data.scans, scan];
      const ok = await adminWrite({ scans: next }, 'Scan added');
      if (!ok) btn.disabled = false; else closeSheet();
    };
  });
}

/* ════════ actions ════════ */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'tab') { S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (act === 'open-stack') { S.tab='supps'; S.open.add('stack:'+el.dataset.stack); render(); window.scrollTo(0,0); }
  else if (act === 'export-csv') exportRecords(el.dataset.type);
  else if (act === 'lab-filter') { S.labFilter = el.dataset.filter === 'outside' ? 'outside' : 'all'; document.querySelectorAll('[data-act="lab-filter"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === S.labFilter))); updateLabResults(); }
  else if (act === 'clear-history') { S.historyQuery=''; S.historyFrom=''; S.historyTo=''; render(); }
  else if (act === 'today') { S.viewDate = new Date(); S.pinnedDate = false; render(); }
  else if (act === 'change-code') { S.token = ''; S.role = null; S.loaded = false; localStorage.removeItem('trey_token'); render(); $('#tok')?.focus(); }
  else if (act === 'day') { const [y, m, d] = el.dataset.k.split('-').map(Number); S.viewDate = new Date(y, m - 1, d); S.pinnedDate = dkey(S.viewDate) !== todayKey(); render(); }
  else if (act === 'weeknav') {
    const d = new Date(S.viewDate); d.setDate(d.getDate() + 7 * Number(el.dataset.dir));
    const sow = (x) => { const s = new Date(x); s.setDate(s.getDate() - s.getDay()); return dkey(s); };
    const cur = sow(new Date());
    if (sow(d) > cur) return; // never navigate past the current week
    S.viewDate = (sow(d) === cur && dkey(d) > todayKey()) ? new Date() : d; // forward into this week lands on today, not a future weekday
    S.pinnedDate = dkey(S.viewDate) !== todayKey();
    render();
  }
  else if (act === 'pull') pull();
  else if (act === 'closesheet') closeSheet();
  else if (act === 'opendose') {
    const c = S.data.compounds.find(x => x.id === el.dataset.id);
    if (c) openDose(c);
  }
  else if (act === 'editcomp') { e.stopPropagation(); const c = S.data.compounds.find(x => x.id === el.dataset.id); if (c) compForm(c); }
  else if (act === 'addcomp') compForm(null);
  else if (act === 'togglepill') { const c = S.data.compounds.find(x => x.id === el.dataset.id); if (c) togglePill(c); }
  else if (act === 'editpill') { e.stopPropagation(); const c = S.data.compounds.find(x => x.id === el.dataset.id); if (c) pillForm(kindOf(c), c); }
  else if (act === 'addpill') pillForm(el.dataset.kind, null);
  else if (act === 'reminders') openReminders();
  else if (act === 'addstack') stackForm(el.dataset.stack, null);
  else if (act === 'editstack') { const c = S.data.compounds.find(x => x.id === el.dataset.id); if (c) stackForm(c.stack, c); }
  else if (act === 'download-document') downloadDocument(el);
  else if (act === 'addlab') labForm();
  else if (act === 'addscan') scanForm();
  else if (act === 'connect') {
    if (el.disabled) return;
    const tok = $('#tok').value.trim();
    if (!tok) return;
    el.disabled = true;
    S.token = tok;
    try {
      const d = await api('/state');
      localStorage.setItem('trey_token', tok);
      S.role = d.role;
      S.data = { compounds: d.compounds||[], logs: d.logs||[], labs: d.labs||[], scans: d.scans||[], stacks: d.stacks||[], _rev: d._rev||0 };
      S.loaded = true; S.sync = 'ok';
      render();
      toast(d.role === 'admin' ? 'Connected as Roman (admin)' : 'Connected as Trey');
      maybeImport();
    } catch (err) {
      S.token = '';
      el.disabled = false;
      const se = $('#seterr'); if (se) se.textContent = err.message || 'That code didn’t work.';
    }
  }
}, true);
// stop card-tap when tapping the admin pencil inside it
document.addEventListener('click', (e) => {
  const p = e.target.closest('[data-act="editcomp"]');
  if (p) e.stopPropagation();
}, true);

document.addEventListener('change', e => {
  if (e.target.id === 'lab-date') { S.labDate = e.target.value; render(); $('#lab-date')?.focus(); }
  if (e.target.id === 'history-from' || e.target.id === 'history-to') { S[e.target.id === 'history-from' ? 'historyFrom' : 'historyTo'] = e.target.value; render(); $('#'+e.target.id)?.focus(); }
  if (e.target.id === 'scan-baseline') { S.compareId = e.target.value; render(); $('#scan-baseline')?.focus(); }
  if (e.target.id === 'scan-date') { S.scanId = e.target.value; render(); $('#scan-date')?.focus(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'history-search') {
    S.historyQuery = e.target.value;
    const fragment = document.createElement('template'); fragment.innerHTML = historyView();
    $('#history-results').innerHTML = fragment.content.querySelector('#history-results').innerHTML;
  }
  if (e.target.id === 'lab-search') { S.labQuery = e.target.value; updateLabResults(); }
});

/* ════════ boot ════════ */
render();
if (S.token) pull();
</script>
